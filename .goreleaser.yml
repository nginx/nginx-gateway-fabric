version: 2
env:
  - CGO_ENABLED=0

builds:
  - id: gateway
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    gcflags:
      - all=-trimpath={{.Env.GOPATH}}
    asmflags:
      - all=-trimpath={{.Env.GOPATH}}
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.telemetryReportPeriod=24h
      - -X main.telemetryEndpoint={{.Env.TELEMETRY_ENDPOINT}}
      - -X main.telemetryEndpointInsecure={{.Env.TELEMETRY_ENDPOINT_INSECURE}}
    main: ./cmd/gateway/
    binary: gateway

changelog:
  disable: true

# Not acted on: releases use `release --snapshot`, which skips publishing, and
# the workflow attaches the assets. Kept so a local `release` still works.
release:
  mode: keep-existing
  draft: false
  prerelease: auto

archives:
  - id: gateway

sboms:
  - artifacts: archive
    documents:
      - "${artifact}.spdx.json"

signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    signature: "${artifact}.sig.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

# Not acted on either; ci.yml closes the milestone after publishing.
milestones:
  - close: true

snapshot:
  # This overrides the git tag, so a release built as a snapshot would be
  # stamped "edge" without an explicit version. Unset or empty leaves nightly
  # and pull request builds as "edge". isEnvSet rather than envOrDefault: it
  # treats empty as unset, and Actions passes an unused input as empty.
  version_template: '{{ if isEnvSet "NGF_VERSION" }}{{ .Env.NGF_VERSION }}{{ else }}edge{{ end }}'
