apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cafe
spec:
  parentRefs:
  - name: gateway
  hostnames:
  - "cafe.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /coffee
    backendRefs:
    - name: coffee
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tea
spec:
  parentRefs:
  - name: gateway
  hostnames:
  - "cafe.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /tea
      headers:
      - name: version
        value: v1
    backendRefs:
    - name: tea
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: tcp-coffee
spec:
  parentRefs:
  - name: gateway
    sectionName: tcp-coffee
  rules:
  - backendRefs:
    - name: tcp-coffee
      port: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcp-coffee
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tcp-coffee
  template:
    metadata:
      labels:
        app: tcp-coffee
    spec:
      containers:
      - name: tcp-coffee
        image: busybox:1.36
        command:
        - /bin/sh
        - -c
        - |
            while true; do
            printf 'tcp-coffee\n' | nc -l -p 9000;
            done
        ports:
        - containerPort: 9000
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: tcp-coffee
spec:
  ports:
  - port: 9000
    targetPort: 9000
    protocol: TCP
    name: tcp
  selector:
    app: tcp-coffee
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coffee
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coffee
  template:
    metadata:
      labels:
        app: coffee
    spec:
      containers:
      - name: coffee
        image: nginxdemos/nginx-hello:plain-text
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: coffee
spec:
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: coffee
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tea
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tea
  template:
    metadata:
      labels:
        app: tea
    spec:
      containers:
      - name: tea
        image: nginxdemos/nginx-hello:plain-text
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: tea
spec:
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: tea
