apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
spec:
  gatewayClassName: nginx
  listeners:
  - name: https-1
    port: 443
    protocol: HTTPS
    hostname: "app1.example.com"
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: app1-tls
      options:
        nginx.org/ssl-certificate-cache: "max=500 valid=5s"
  - name: https-2
    port: 443
    protocol: HTTPS
    hostname: "app2.example.com"
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: app2-tls
      options:
        nginx.org/ssl-certificate-cache: "max=500 valid=5s"
