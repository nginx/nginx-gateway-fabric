# Resources created by the gateway admin (Gateway + ClientSettingsPolicy) and app developer (two HTTPRoutes)
# to verify telemetry counts reflect real per-role resources.
---
# App backend used by the app developer's routes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coffee
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coffee
  template:
    metadata:
      labels:
        app: coffee
    spec:
      containers:
      - name: coffee
        image: nginxdemos/nginx-hello:plain-text
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: coffee
spec:
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: coffee
---
# Gateway admin creates a Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: telemetry-gateway
spec:
  gatewayClassName: nginx
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    hostname: "*.example.com"
---
# Gateway admin attaches a ClientSettingsPolicy to the Gateway.
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: gw-csp
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: telemetry-gateway
  body:
    maxSize: 4k
---
# App developer creates two HTTPRoutes.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coffee-route-1
spec:
  parentRefs:
  - name: telemetry-gateway
  hostnames:
  - "cafe.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /coffee
    backendRefs:
    - name: coffee
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coffee-route-2
spec:
  parentRefs:
  - name: telemetry-gateway
  hostnames:
  - "other.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /coffee
    backendRefs:
    - name: coffee
      port: 80
