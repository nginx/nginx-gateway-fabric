# Resources created by the gateway admin (Gateway + ClientSettingsPolicy) and app developer (two HTTPRoutes)
# to verify telemetry counts reflect real per-role resources.
# Both routes reference the same "coffee" Service, which is not deployed. NGF counts referenced Services
# whether or not they exist, so ServiceCount is 1 (deduplicated) and EndpointCount is 0.
---
# Gateway admin creates a Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: telemetry-gateway
spec:
  gatewayClassName: nginx
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    hostname: "*.example.com"
---
# Gateway admin attaches a ClientSettingsPolicy to the Gateway.
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: gw-csp
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: telemetry-gateway
  body:
    maxSize: 4k
---
# App developer creates two HTTPRoutes.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coffee-route-1
spec:
  parentRefs:
  - name: telemetry-gateway
  hostnames:
  - "cafe.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /coffee
    backendRefs:
    - name: coffee
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coffee-route-2
spec:
  parentRefs:
  - name: telemetry-gateway
  hostnames:
  - "other.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /coffee
    backendRefs:
    - name: coffee
      port: 80
