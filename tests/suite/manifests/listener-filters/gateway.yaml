apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
spec:
  gatewayClassName: nginx
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    hostname: "*.example.com"
    filters:
      requests:
      - type: ExternalAuth
        externalAuth:
          protocol: HTTP
          backendRef:
            name: ext-auth-1
            port: 80
          http:
            path: /auth1
            allowedHeaders:
            - X-Auth-1
            allowedResponseHeaders:
            - X-User-Id
            - X-Shared
      - type: ExternalAuth
        externalAuth:
          protocol: HTTP
          backendRef:
            name: ext-auth-2
            port: 80
          http:
            path: /auth2
            allowedHeaders:
            - X-Auth-2
            # X-User-Id is the response header of the first filter: forwarding it here checks that
            # the second filter reads the value the first filter returned.
            - X-User-Id
            allowedResponseHeaders:
            - X-Shared
  # The more specific hostname is unfiltered to check that the wildcard listener's filters do not
  # extend to hostnames the exact listener owns.
  - name: http-public
    port: 80
    protocol: HTTP
    hostname: "public.example.com"
