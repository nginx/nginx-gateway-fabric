kind: AccessPolicy
metadata:
  name: allow-net2
spec:
  action: Allow
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: coffee
  rules:
  - name: test-net-2
    source:
      type: IPAddress
      ipAddress:
        address: "198.51.100.0/24"
