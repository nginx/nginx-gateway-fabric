apiVersion: gateway.nginx.org/v1alpha1
kind: AccessPolicy
metadata:
  name: allow-net1
spec:
  action: Allow
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: coffee
  rules:
  - name: test-net-1
    source:
      type: IPAddress
      ipAddress:
        address: "192.0.2.0/24"
---
