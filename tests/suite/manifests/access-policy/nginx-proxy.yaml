apiVersion: gateway.nginx.org/v1alpha2
kind: NginxProxy
metadata:
  name: access-policy-proxy
spec:
  rewriteClientIP:
    mode: XForwardedFor
    # Trust all source IPs so the test runner can forge any client IP via
    # X-Forwarded-For, enabling non-loopback and IPv6 address testing.
    trustedAddresses:
    - type: CIDR
      value: "0.0.0.0/0"
