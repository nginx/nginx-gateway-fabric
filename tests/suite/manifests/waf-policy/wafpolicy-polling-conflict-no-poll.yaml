# WAFPolicy WITHOUT polling, targeting the coffee HTTPRoute.
# Uses the same bundle URL as wafpolicy-polling-conflict-poll.yaml.
# This policy is created first so it is older and wins the conflict.
apiVersion: gateway.nginx.org/v1alpha1
kind: WAFPolicy
metadata:
  name: coffee-waf-no-poll
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: coffee
  type: HTTP
  policySource:
    httpSource:
      url: http://bundle-server.waf-policy.svc.cluster.local/attack-signatures-blocking.tgz
