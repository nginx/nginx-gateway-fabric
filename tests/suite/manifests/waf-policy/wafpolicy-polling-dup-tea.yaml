# WAFPolicy with polling enabled targeting the tea HTTPRoute.
# Uses the same bundle URL as wafpolicy-polling-dup-coffee.yaml.
# Both policies have polling enabled, so they should coexist without conflict.
apiVersion: gateway.nginx.org/v1alpha1
kind: WAFPolicy
metadata:
  name: tea-waf-poll-dup
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: tea
  type: HTTP
  policySource:
    httpSource:
      url: http://bundle-server.waf-policy.svc.cluster.local/attack-signatures-blocking.tgz
    polling:
      enabled: true
      interval: 15s
