# type: PLM WAFPolicy targeting the coffee HTTPRoute with the same APPolicy and
# APLogConf as wafpolicy-plm-duplicate-tea.yaml. Both policies reference the
# identical PLM-compiled bundles, which could trigger "Duplicate policy name found"
# if bundles are not properly deduplicated.
apiVersion: gateway.nginx.org/v1alpha1
kind: WAFPolicy
metadata:
  name: coffee-waf-plm-dup
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: coffee
  type: PLM
  policyRef:
    apPolicyRef:
      name: attack-signatures
  securityLogs:
  - logRef:
      apLogConfRef:
        name: log-illegal
    destination:
      type: stderr
