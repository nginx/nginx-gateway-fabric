# PayloadProcessor + BackendTLSPolicy exercising the in-cluster HTTPS guardrails backend path.
#
# The PayloadProcessor targets the same HTTPRoute (llm-route) but points at the TLS guardrails
# Service (guardrails-api-tls:8443). Because a BackendTLSPolicy targets that Service, NGF resolves
# the backend URL as https and emits proxy_ssl_* verification on the guardrails internal location,
# verified against the CA in the "guardrails-ca" ConfigMap (created by the test at runtime).
apiVersion: gateway.nginx.org/v1alpha1
kind: PayloadProcessor
metadata:
  name: llm-guardrails-https
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: llm-route
  processors:
  - type: ExtProcess
    extProcess:
      backendRef:
        group: ""
        kind: Service
        name: guardrails-api-tls
        port: 8443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: guardrails-api-tls
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: guardrails-api-tls
  validation:
    caCertificateRefs:
    - group: ""
      kind: ConfigMap
      name: guardrails-ca
    # Must match a SAN on the backend serving cert (generated by the test) and the in-cluster
    # Service FQDN NGF proxies to; drives SNI, Host, and certificate hostname verification.
    hostname: guardrails-api-tls.guardrails.svc.cluster.local
