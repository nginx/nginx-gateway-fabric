apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-llm
  labels:
    app: mock-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-llm
  template:
    metadata:
      labels:
        app: mock-llm
    spec:
      containers:
      - name: mock-llm
        image: guardrails-mock:latest
        imagePullPolicy: Never
        # Sentinels must match the payloads asserted in guardrails_test.go. Set explicitly here
        # (rather than relying on the mock's built-in defaults) so this manifest is the single
        # source of truth and the two cannot silently drift.
        env:
        - name: BLOCK_SENTINEL
          value: BLOCKME
        - name: RESPONSE_BLOCK_SENTINEL
          value: BLOCKRESP
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: mock-llm
spec:
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: mock-llm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardrails-api
  labels:
    app: guardrails-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guardrails-api
  template:
    metadata:
      labels:
        app: guardrails-api
    spec:
      containers:
      - name: guardrails-api
        image: guardrails-mock:latest
        imagePullPolicy: Never
        # Sentinels must match the payloads asserted in guardrails_test.go. Set explicitly here
        # (rather than relying on the mock's built-in defaults) so this manifest is the single
        # source of truth and the two cannot silently drift.
        env:
        - name: BLOCK_SENTINEL
          value: BLOCKME
        - name: RESPONSE_BLOCK_SENTINEL
          value: BLOCKRESP
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: guardrails-api
spec:
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: guardrails-api
