# HTTPRoute referencing a sectionName that does not exist on the Gateway.
# Should receive NotAllowedByListeners from the Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bad-section
spec:
  parentRefs:
  - name: advanced-routing-gateway
    sectionName: does-not-exist
  hostnames:
  - "cafe.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /coffee
    backendRefs:
    - name: coffee-v1
      port: 80
