apiVersion: gateway.nginx.org/v1alpha2
kind: NginxProxy
metadata:
  name: combined-zone-proxy
spec:
  cache:
    maxSize: "1g"
    inactive: "60m"
    levels: "1:2"
    zoneSize: "256m"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
spec:
  gatewayClassName: nginx
  infrastructure:
    parametersRef:
      group: gateway.nginx.org
      kind: NginxProxy
      name: combined-zone-proxy
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    hostname: "*.example.com"
