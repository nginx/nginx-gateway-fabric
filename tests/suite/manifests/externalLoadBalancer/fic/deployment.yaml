apiVersion: apps/v1
kind: Deployment
metadata:
  name: f5-ipam-controller
  namespace: ${FIC_NAMESPACE}
  labels:
    app: f5-ipam-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: f5-ipam-controller
  template:
    metadata:
      labels:
        app: f5-ipam-controller
    spec:
      serviceAccountName: ipam-ctlr
      containers:
        - name: f5-ipam-controller
          image: f5networks/f5-ipam-controller:0.1.13
          command: ["/app/bin/f5-ipam-controller"]
          args:
            - "--orchestration=kubernetes"
            # The range is substituted from the node subnet at setup time so the pool is region
            # agnostic and reachable. It deliberately avoids a zero-valued octet: F5 IPAM Controller
            # v0.1.13 strips a 0 octet when it parses the range, so a .0.x pool would be stored and
            # handed back mangled and traffic would go nowhere.
            - '--ip-range={"production":"${IPAM_RANGE}"}'
            - "--log-level=DEBUG"
          volumeMounts:
            # F5 IPAM Controller writes its allocation database here. Without a writable mount it
            # fails to create the DB file and crashloops.
            - name: ipamdb
              mountPath: /app/ipamdb
      volumes:
        - name: ipamdb
          emptyDir: {}
