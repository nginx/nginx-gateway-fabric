# AuthenticationFilter referencing a JWKS Secret that does not yet exist.
# Used to verify that the filter is rejected (Invalid) when the secret is absent,
# and resolves to Accepted once the secret is created.
apiVersion: gateway.nginx.org/v1alpha1
kind: AuthenticationFilter
metadata:
  name: jwt-missing-secret
spec:
  type: JWT
  jwt:
    realm: "JWT Missing Secret"
    source: File
    file:
      secretRef:
        name: jwks-missing-secret
    keyCache: 10m
