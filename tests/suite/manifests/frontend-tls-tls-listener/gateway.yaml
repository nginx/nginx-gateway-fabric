apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
spec:
  gatewayClassName: nginx
  tls:
    frontend:
      default:
        validation:
          caCertificateRefs:
          - group: ""
            kind: Secret
            name: ca-secret
          mode: AllowValidOnly
  listeners:
  - name: tls-terminate
    port: 443
    protocol: TLS
    hostname: "app.example.com"
    tls:
      mode: Terminate
      certificateRefs:
      - group: ""
        kind: Secret
        name: server-secret
