nginxGateway:
  replicaCount: 2
  # must exceed the preStop sleep duration (40s) to avoid FailedPreStopHook
  terminationGracePeriodSeconds: 50
  lifecycle:
    preStop:
      exec:
        command:
        - /usr/bin/gateway
        - sleep
        - --duration=40s

nginx:
  lifecycle:
    preStop:
      exec:
        command:
        - /bin/sleep
        - "40"

terminationGracePeriodSeconds: 50

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - topologyKey: kubernetes.io/hostname
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: nginx-gateway
