# HTTPRoute with a hostname that does not match the Gateway's listener hostname (*.example.com).
# Should receive NoMatchingListenerHostname on its parent status.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wrong-hostname
spec:
  parentRefs:
  - name: gateway
    namespace: GATEWAY_NAMESPACE
  hostnames:
  - "notexample.org"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /coffee
    backendRefs:
    - name: coffee
      port: 80
