# HTTPRoute from a namespace not permitted by the Gateway's allowedRoutes selector.
# Should receive NotAllowedByListeners on its parent status.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bad-ns-coffee
spec:
  parentRefs:
  - name: gateway
    namespace: GATEWAY_NAMESPACE
  hostnames:
  - "cafe.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /coffee
    backendRefs:
    - name: coffee
      port: 80
