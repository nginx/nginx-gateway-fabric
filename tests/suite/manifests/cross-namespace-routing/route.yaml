# HTTPRoute in app-ns, backend Service in backend-ns.
# Requires a ReferenceGrant in backend-ns to allow the cross-namespace backend ref.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coffee
spec:
  parentRefs:
  - name: gateway
    namespace: GATEWAY_NAMESPACE
  hostnames:
  - "cafe.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /coffee
    backendRefs:
    - name: coffee
      namespace: BACKEND_NAMESPACE
      port: 80
