nginxGateway:
  lifecycle:
    preStop:
      exec:
        command:
          - /usr/bin/gateway
          - sleep
          - --duration=40s
  terminationGracePeriodSeconds: 50


nginx:
  pod:
    terminationGracePeriodSeconds: 50
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                gateway.networking.k8s.io/gateway-name: gateway
  container:
    lifecycle:
      preStop:
        exec:
          command:
            - /bin/sleep
            - "40"
