[package]
name = "guardrails_filter"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["F5 AI Guardrails Contributors"]
description = "Rust NGINX module for streaming LLM response inspection with F5 AI Guardrails"

[lib]
name = "ai_guardrails"
# cdylib produces the .so for nginx; rlib is needed for `cargo test` to link the test harness
crate-type = ["cdylib", "rlib"]

[dependencies]
ngx = { version = "0.5", features = ["async"] }
nginx-sys = "0.5"
http = "1"
bytes = "1"
paste = "1.0"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# futures: used only for `futures::channel::oneshot`, which bridges the C
# `post_subrequest` completion callback into the Rust async runtime for the
# non-blocking inspection paths (see subrequest_client.rs). We depend on
# the lightweight `futures-channel` piece rather than the whole futures stack;
# no network/TLS code is pulled in.
#
# NOTE: both inspection directions (request and response) now inspect via an
# in-process NGINX subrequest that proxies to the guardrails backend, so the
# module no longer makes its own outbound HTTP call. There is deliberately no
# blocking HTTP client (previously `minreq`) or bundled Rust TLS stack: TLS to
# the guardrails backend is handled by NGINX's own `proxy_ssl` on the internal
# location.
futures = { version = "0.3", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
