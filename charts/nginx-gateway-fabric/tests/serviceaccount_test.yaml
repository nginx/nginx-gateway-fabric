suite: test serviceAccount
templates:
  - serviceaccount.yaml
tests:
  - it: should render serviceAccount kind with the correct metadata name and namespace by default
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-nginx-gateway-fabric
      - equal:
          path: metadata.namespace
          value: NAMESPACE

  - it: should render the correct labels by default
    asserts:
      - isKind:
          of: ServiceAccount
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/name: nginx-gateway-fabric
            app.kubernetes.io/version: edge
      - matchRegex:
          path: 'metadata.labels["helm.sh/chart"]'
          pattern: nginx-gateway-fabric-[0-9]+\.[0-9]+\.[0-9]+

  - it: should not render ServiceAccount annotations by default
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.annotations
          value: {}

  - it: should render the correct annotations when set
    set:
      nginxGateway.serviceAccount.annotations:
        name: svc-acc
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.annotations
          value:
            name: svc-acc

  - it: should not render imagePullSecrets by default
    asserts:
      - isKind:
          of: ServiceAccount
      - notContains:
          path: imagePullSecrets

  - it: should render the correct ServiceAccount name and imagePullSecrets when set
    set:
      nginxGateway.serviceAccount.name: svc-acc
      nginxGateway.serviceAccount.imagePullSecrets:
        - deploy
        - test
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: svc-acc
      - equal:
          path: imagePullSecrets
          value:
            - name: deploy
            - name: test

  - it: should not automatically mount the service account token by default
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: automountServiceAccountToken
          value: false
