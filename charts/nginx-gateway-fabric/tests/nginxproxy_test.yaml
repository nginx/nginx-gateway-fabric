suite: test nginxproxy
templates:
  - nginxproxy.yaml
tests:
  - it: should render an NginxProxy with the name and namespace by default
    asserts:
      - isKind:
          of: NginxProxy
      - equal:
          path: metadata.name
          value: RELEASE-NAME-proxy-config
      - equal:
          path: metadata.namespace
          value: NAMESPACE

  - it: should render the correct labels by default
    asserts:
      - isKind:
          of: NginxProxy
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: nginx-gateway-fabric
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/version: "edge"
            app.kubernetes.io/managed-by: Helm
      - matchRegex:
          path: 'metadata.labels["helm.sh/chart"]'
          pattern: nginx-gateway-fabric-[0-9]+\.[0-9]+\.[0-9]+

  - it: should render the default amount of replicas
    asserts:
      - isKind:
          of: NginxProxy
      - equal:
          path: spec.kubernetes.deployment.replicas
          value: 1

  - it: should render the correct amount of replicas when set
    set:
      nginx.replicas: 3
    asserts:
      - isKind:
          of: NginxProxy
      - equal:
          path: spec.kubernetes.deployment.replicas
          value: 3

  - it: should render the the imagePullPolicy, repository and tag by default
    asserts:
      - isKind:
          of: NginxProxy
      - equal:
          path: spec.kubernetes.deployment.container.image.pullPolicy
          value: Always
      - equal:
          path: spec.kubernetes.deployment.container.image.repository
          value: ghcr.io/nginx/nginx-gateway-fabric/nginx
      - equal:
          path: spec.kubernetes.deployment.container.image.tag
          value: edge

  - it: should render the the imagePullPolicy, repository and tag when set
    set:
      nginx.image.pullPolicy: IfNotPresent
      nginx.image.repository: ghcr.io/nginx/nginx-gateway-fabric/ngf
      nginx.image.tag: latest
    asserts:
      - isKind:
          of: NginxProxy
      - equal:
          path: spec.kubernetes.deployment.container.image.pullPolicy
          value: IfNotPresent
      - equal:
          path: spec.kubernetes.deployment.container.image.repository
          value: ghcr.io/nginx/nginx-gateway-fabric/ngf
      - equal:
          path: spec.kubernetes.deployment.container.image.tag
          value: latest

  - it: should render the kubernetes service `externalTrafficPolicy` and type be default
    asserts:
      - isKind:
          of: NginxProxy
      - equal:
          path: spec.kubernetes.service.externalTrafficPolicy
          value: Local
      - equal:
          path: spec.kubernetes.service.type
          value: LoadBalancer

  - it: should not render a data plane podDisruptionBudget by default
    asserts:
      - isKind:
          of: NginxProxy
      - notExists:
          path: spec.kubernetes.deployment.podDisruptionBudget

  - it: should render the data plane podDisruptionBudget with the default minAvailable when enabled
    set:
      nginx.podDisruptionBudget.enable: true
    asserts:
      - isKind:
          of: NginxProxy
      - equal:
          path: spec.kubernetes.deployment.podDisruptionBudget.minAvailable
          value: 1
      - notExists:
          path: spec.kubernetes.deployment.podDisruptionBudget.maxUnavailable
      - notExists:
          path: spec.kubernetes.deployment.podDisruptionBudget.unhealthyPodEvictionPolicy

  - it: should render the data plane podDisruptionBudget minAvailable when set to a percentage
    set:
      nginx.podDisruptionBudget.enable: true
      nginx.podDisruptionBudget.minAvailable: "50%"
    asserts:
      - isKind:
          of: NginxProxy
      - equal:
          path: spec.kubernetes.deployment.podDisruptionBudget.minAvailable
          value: "50%"

  - it: should render the data plane podDisruptionBudget maxUnavailable when minAvailable is cleared
    set:
      nginx.podDisruptionBudget.enable: true
      nginx.podDisruptionBudget.minAvailable: ""
      nginx.podDisruptionBudget.maxUnavailable: "25%"
    asserts:
      - isKind:
          of: NginxProxy
      - equal:
          path: spec.kubernetes.deployment.podDisruptionBudget.maxUnavailable
          value: "25%"
      - notExists:
          path: spec.kubernetes.deployment.podDisruptionBudget.minAvailable

  - it: should render the data plane podDisruptionBudget unhealthyPodEvictionPolicy when set
    set:
      nginx.podDisruptionBudget.enable: true
      nginx.podDisruptionBudget.unhealthyPodEvictionPolicy: AlwaysAllow
    asserts:
      - isKind:
          of: NginxProxy
      - equal:
          path: spec.kubernetes.deployment.podDisruptionBudget.unhealthyPodEvictionPolicy
          value: AlwaysAllow

  - it: should not render a data plane podDisruptionBudget when `kind` is set to daemonSet
    set:
      nginx.kind: daemonSet
      nginx.podDisruptionBudget.enable: true
    asserts:
      - isKind:
          of: NginxProxy
      - notExists:
          path: spec.kubernetes.deployment
      - notExists:
          path: spec.kubernetes.daemonSet.podDisruptionBudget

---
suite: test nginxproxy with serviceMonitor enabled
capabilities:
  apiVersions:
    - monitoring.coreos.com/v1
templates:
  - nginxproxy.yaml
tests:
  - it: should render the nginx proxy with the relevant serviceMonitor port and interval
    set:
      nginx.serviceMonitor.enable: true
      nginx.serviceMonitor.port: "8083"
      nginx.serviceMonitor.interval: "5"
    asserts:
      - isKind:
          of: NginxProxy
      - equal:
          path: spec.kubernetes.deployment.serviceMonitor.endpoints
          value:
            - port: 8083
              interval: 5

  - it: should render the NginxProxy with the relevant serviceMonitor port and interval when `kind` is set to DaemonSet
    set:
      nginx.kind: daemonSet
      nginx.serviceMonitor.enable: true
      nginx.serviceMonitor.port: "8084"
      nginx.serviceMonitor.interval: "6"
    asserts:
      - isKind:
          of: NginxProxy
      - equal:
          path: spec.kubernetes.daemonSet.serviceMonitor.endpoints
          value:
            - port: 8084
              interval: 6
