suite: test service
templates:
  - service.yaml
tests:
  - it: should render a ClusterIP Service on port 443 by default
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.type
          value: ClusterIP
      - contains:
          path: spec.ports
          content:
            name: agent-grpc
            port: 443
            protocol: TCP
            targetPort: 8443

  - it: should render the selector information and the metrics port information by default
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: nginx-gateway-fabric
            app.kubernetes.io/instance: RELEASE-NAME
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 9113
            protocol: TCP
            targetPort: 9113

  - it: should render the correct labels by default
    asserts:
      - isKind:
          of: Service
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/name: nginx-gateway-fabric
            app.kubernetes.io/version: edge
      - matchRegex:
          path: 'metadata.labels["helm.sh/chart"]'
          pattern: nginx-gateway-fabric-[0-9].[0-9].[0-9]

  - it: should render the correct default labels and new labels when set
    set:
      nginxGateway.service.labels:
        name: svc
    asserts:
      - isKind:
          of: Service
      - isSubset:
          path: metadata.labels
          content:
            name: svc
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/name: nginx-gateway-fabric
            app.kubernetes.io/version: edge
      - matchRegex:
          path: 'metadata.labels["helm.sh/chart"]'
          pattern: nginx-gateway-fabric-[0-9].[0-9].[0-9]

  - it: should not render service annotations by default
    asserts:
      - isKind:
          of: Service
      - notContains:
          path: metadata.annotations

  - it: should render the correct annotations when set
    set:
      nginxGateway.service.annotations:
        "helm.sh/hook": pre-install, pre-upgrade
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.annotations
          value:
            "helm.sh/hook": pre-install, pre-upgrade
