suite: test rbac
chart:
  version: 2.7.0
  appVersion: edge
capabilities:
  apiVersions:
    - rbac.authorization.k8s.io/v1
templates:
  - rbac.yaml
tests:
  - it: should render the correct metadata name and not render a namespace, as this is a cluster-scoped resource
    asserts:
      - isKind:
          of: ClusterRole
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-nginx-gateway-fabric
      - notContains:
          path: metadata.namespace
          content: NAMESPACE
