suite: test rbac
capabilities:
  apiVersions:
    - rbac.authorization.k8s.io/v1
templates:
  - rbac.yaml
tests:
  - it: should render the correct metadata name and not render a namespace, as this is a cluster-scoped resource
    set:
      nginxGateway.watchNamespaces:
        - default
    asserts:
      - isKind:
          of: Role
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-nginx-gateway-fabric
      - equal:
          path: metadata.namespace
          value: default
        documentIndex: 0

  - it: should render the corect metadata and namespace for kind RoleBinding
    set:
      nginxGateway.watchNamespaces:
        - default
    asserts:
      - isKind:
          of: RoleBinding
        documentIndex: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-nginx-gateway-fabric
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: default
        documentIndex: 1

  - it: should render the correct metadata name and not render a namespace for ClusterRole, as this is a cluster-scoped resource
    set:
      nginxGateway.watchNamespaces:
        - default
    asserts:
      - isKind:
          of: ClusterRole
        documentSelector:
          path: kind
          value: ClusterRole
      - equal:
          path: metadata.name
          value: RELEASE-NAME-nginx-gateway-fabric
        documentSelector:
          path: kind
          value: ClusterRole
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: nginx-gateway-fabric
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/version: "edge"
            app.kubernetes.io/managed-by: Helm
        documentSelector:
          path: kind
          value: ClusterRole
      - matchRegex:
          path: 'metadata.labels["helm.sh/chart"]'
          pattern: nginx-gateway-fabric-[0-9]+\.[0-9]+\.[0-9]+
        documentSelector:
          path: kind
          value: ClusterRole
      - notContains:
          path: metadata.namespace
        documentSelector:
          path: kind
          value: ClusterRole

  - it: should render the correct metadata name and not render a namespace for ClusterRoleBinding, as this is a cluster-scoped resource
    set:
      nginxGateway.watchNamespaces:
        - default
    asserts:
      - isKind:
          of: ClusterRoleBinding
        documentSelector:
          path: kind
          value: ClusterRoleBinding
      - equal:
          path: metadata.name
          value: RELEASE-NAME-nginx-gateway-fabric
        documentSelector:
          path: kind
          value: ClusterRoleBinding
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: nginx-gateway-fabric
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/version: "edge"
            app.kubernetes.io/managed-by: Helm
        documentSelector:
          path: kind
          value: ClusterRoleBinding
      - matchRegex:
          path: 'metadata.labels["helm.sh/chart"]'
          pattern: nginx-gateway-fabric-[0-9]+\.[0-9]+\.[0-9]+
        documentSelector:
          path: kind
          value: ClusterRoleBinding
      - notContains:
          path: metadata.namespace
        documentSelector:
          path: kind
          value: ClusterRoleBinding

  - it: should grant Secret permissions in the ClusterRole when watchSecretNamespaces is not set
    asserts:
      - hasDocuments:
          count: 2
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - secrets
              - configmaps
              - serviceaccounts
              - services
            verbs:
              - create
              - update
              - delete
              - list
              - get
              - watch
        documentSelector:
          path: kind
          value: ClusterRole

  - it: should grant Secret permissions only in the Secret namespaces and the release namespace when watchSecretNamespaces is set
    release:
      namespace: nginx-gateway
    set:
      nginxGateway.watchSecretNamespaces:
        - tenant-certs
    asserts:
      - hasDocuments:
          count: 6
      - notMatchRegex:
          path: rules[*].resources[*]
          pattern: ^secrets$
        documentSelector:
          path: kind
          value: ClusterRole
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - configmaps
              - serviceaccounts
              - services
            verbs:
              - create
              - update
              - delete
              - list
              - get
              - watch
        documentSelector:
          path: kind
          value: ClusterRole
      - isKind:
          of: Role
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: tenant-certs
        documentIndex: 0
      - equal:
          path: rules
          value:
            - apiGroups:
                - ""
              resources:
                - secrets
              verbs:
                - create
                - update
                - delete
                - list
                - get
                - watch
        documentIndex: 0
      - isKind:
          of: RoleBinding
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: tenant-certs
        documentIndex: 1
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: RELEASE-NAME-nginx-gateway-fabric
              namespace: nginx-gateway
        documentIndex: 1
      - isKind:
          of: Role
        documentIndex: 2
      - equal:
          path: metadata.namespace
          value: nginx-gateway
        documentIndex: 2
      - equal:
          path: rules[0].resources
          value:
            - secrets
        documentIndex: 2

  - it: should grant Secret permissions only in the watched Secret namespaces when watchNamespaces is also set
    release:
      namespace: nginx-gateway
    set:
      nginxGateway.watchNamespaces:
        - app-a
        - tenant-certs
      nginxGateway.watchSecretNamespaces:
        - tenant-certs
    asserts:
      - hasDocuments:
          count: 8
      - equal:
          path: metadata.namespace
          value: app-a
        documentIndex: 0
      - notMatchRegex:
          path: rules[*].resources[*]
          pattern: ^secrets$
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: tenant-certs
        documentIndex: 2
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - secrets
            verbs:
              - create
              - update
              - delete
              - list
              - get
              - watch
        documentIndex: 2
      - notMatchRegex:
          path: rules[*].resources[*]
          pattern: ^secrets$
        documentSelector:
          path: kind
          value: ClusterRole

  - it: should fail when watchSecretNamespaces is not a subset of watchNamespaces
    set:
      nginxGateway.watchNamespaces:
        - app-a
      nginxGateway.watchSecretNamespaces:
        - tenant-certs
    asserts:
      - failedTemplate:
          errorMessage: nginxGateway.watchSecretNamespaces references namespace "tenant-certs", which is not included in nginxGateway.watchNamespaces
  - it: should include XBackend rules when experimental features are enabled
    template: templates/rbac.yaml
    set:
      nginxGateway.gwAPIExperimentalFeatures.enable: true
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - gateway.networking.x-k8s.io
            resources:
              - xbackends
            verbs:
              - list
              - watch
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups:
              - gateway.networking.x-k8s.io
            resources:
              - xbackends/status
            verbs:
              - update
        documentIndex: 0
  - it: should not include XBackend rules when experimental features are disabled
    template: templates/rbac.yaml
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - gateway.networking.x-k8s.io
            resources:
              - xbackends
            verbs:
              - list
              - watch
        documentIndex: 0
      - notContains:
          path: rules
          content:
            apiGroups:
              - gateway.networking.x-k8s.io
            resources:
              - xbackends/status
            verbs:
              - update
        documentIndex: 0
