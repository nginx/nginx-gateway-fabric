suite: test rbac
capabilities:
  apiVersions:
    - rbac.authorization.k8s.io/v1
templates:
  - rbac.yaml
tests:
  - it: should render the correct metadata name and not render a namespace, as this is a cluster-scoped resource
    set:
      nginxGateway.watchNamespaces:
        - default
    asserts:
      - isKind:
          of: Role
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-nginx-gateway-fabric
      - equal:
          path: metadata.namespace
          value: default
        documentIndex: 0

  - it: should render the corect metadata and namespace for kind RoleBinding
    set:
      nginxGateway.watchNamespaces:
        - default
    asserts:
      - isKind:
          of: RoleBinding
        documentIndex: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-nginx-gateway-fabric
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: default
        documentIndex: 1

  - it: should render the correct metadata name and not render a namespace for ClusterRole, as this is a cluster-scoped resource
    set:
      nginxGateway.watchNamespaces:
        - default
    asserts:
      - isKind:
          of: ClusterRole
        documentSelector:
          path: kind
          value: ClusterRole
      - equal:
          path: metadata.name
          value: RELEASE-NAME-nginx-gateway-fabric
        documentSelector:
          path: kind
          value: ClusterRole
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: nginx-gateway-fabric
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/version: "edge"
            app.kubernetes.io/managed-by: Helm
        documentSelector:
          path: kind
          value: ClusterRole
      - matchRegex:
          path: 'metadata.labels["helm.sh/chart"]'
          pattern: nginx-gateway-fabric-[0-9]+\.[0-9]+\.[0-9]+
        documentSelector:
          path: kind
          value: ClusterRole
      - notContains:
          path: metadata.namespace
        documentSelector:
          path: kind
          value: ClusterRole

  - it: should render the correct metadata name and not render a namespace for ClusterRoleBinding, as this is a cluster-scoped resource
    set:
      nginxGateway.watchNamespaces:
        - default
    asserts:
      - isKind:
          of: ClusterRoleBinding
        documentSelector:
          path: kind
          value: ClusterRoleBinding
      - equal:
          path: metadata.name
          value: RELEASE-NAME-nginx-gateway-fabric
        documentSelector:
          path: kind
          value: ClusterRoleBinding
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: nginx-gateway-fabric
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/version: "edge"
            app.kubernetes.io/managed-by: Helm
        documentSelector:
          path: kind
          value: ClusterRoleBinding
      - matchRegex:
          path: 'metadata.labels["helm.sh/chart"]'
          pattern: nginx-gateway-fabric-[0-9]+\.[0-9]+\.[0-9]+
        documentSelector:
          path: kind
          value: ClusterRoleBinding
      - notContains:
          path: metadata.namespace
        documentSelector:
          path: kind
          value: ClusterRoleBinding
