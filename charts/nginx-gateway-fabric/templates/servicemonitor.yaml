{{- if and .Values.nginxGateway.metrics.enable .Values.nginxGateway.metrics.serviceMonitor.enable }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "nginx-gateway.serviceMonitorName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "nginx-gateway.labels" . | nindent 4 }}
  {{- if .Values.nginxGateway.metrics.serviceMonitor.labels }}
    {{- toYaml .Values.nginxGateway.metrics.serviceMonitor.labels | nindent 4 }}
  {{- end }}
  annotations:
  {{- if .Values.nginxGateway.metrics.serviceMonitor.annotations -}}
    {{- toYaml .Values.nginxGateway.metrics.serviceMonitor.annotations | nindent 4 }}
  {{- end }}
spec:
  namespaceSelector:
    matchNames:
    - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "nginx-gateway.selectorLabels" . | nindent 6}}
  endpoints:
  - port: metrics
    {{- if .Values.nginxGateway.metrics.serviceMonitor.interval }}
    interval: {{ .Values.nginxGateway.metrics.serviceMonitor.interval }}
    {{- end }}
    {{- if .Values.nginxGateway.metrics.secure }}
    schema: https
    tlsConfig:
      insecureSkipVerify: true
    {{- end }}
{{- end }}
