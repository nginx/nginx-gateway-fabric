{{- /*
`gateways` and `spec.listeners` accept either a list or a map keyed by name.
Unlike lists, maps are deep-merged by Helm, so an override only has to set the leaf it cares about. See values.yaml.
*/}}
{{- range include "nginx-gateway.named-list" .Values.gateways | fromYamlArray }}
{{- $listeners := include "nginx-gateway.named-list" .spec.listeners | fromYamlArray }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ default "gateway" .name }}
  {{- with .namespace }}
  namespace: {{ .}}
  {{- end }}
  {{- with .labels }}
  labels:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .annotations }}
  annotations:
  {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ default "nginx" .spec.gatewayClassName }}
  {{- with .spec.allowedListeners }}
  allowedListeners:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .spec.infrastructure }}
  infrastructure:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .spec.addresses }}
  addresses:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  listeners:
    {{- range $listener := $listeners }}
    - name: {{ $listener.name }}
      {{- with $listener.hostname }}
      hostname: {{ . | toYaml }}
      {{- end }}
      port: {{ $listener.port }}
      protocol: {{ $listener.protocol }}
      {{- with $listener.allowedRoutes }}
      allowedRoutes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $listener.tls }}
      tls:
        {{- toYaml . | nindent 8 }}
      {{- end}}
      {{- end }}
  {{- with .spec.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
