version: "2"
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - copyloopvar
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - fatcontext
    - forcetypeassert
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocritic
    - gocyclo
    - godot
    - gosec
    - gosmopolitan
    - govet
    - ineffassign
    - intrange
    - lll
    - loggercheck
    - makezero
    - mirror
    - misspell
    - musttag
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - predeclared
    - promlinter
    - reassign
    - revive
    - spancheck
    - staticcheck
    - tagalign
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace
  settings:
    dupword:
      ignore:
        - test
    ginkgolinter:
      forbid-focus-container: true
    gocyclo:
      min-complexity: 15
    govet:
      enable:
        - fieldalignment
    lll:
      line-length: 120
    misspell:
      locale: US
    revive:
      rules:
        - name: blank-imports
        - name: constant-logical-expr
        - name: context-as-argument
        - name: context-keys-type
        - name: defer
        - name: dot-imports
          arguments:
            - allowedPackages:
                - github.com/onsi/gomega
                - github.com/onsi/ginkgo/v2
        - name: duplicated-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: import-shadowing
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: range-val-address
        - name: range-val-in-closure
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: string-of-int
        - name: superfluous-else
        - name: time-naming
        - name: unchecked-type-assertion
        - name: unexported-return
        - name: unnecessary-stmt
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
    staticcheck:
      dot-import-whitelist:
        - github.com/onsi/gomega
        - github.com/onsi/ginkgo/v2
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Upstream marks route-level sessionPersistence as deprecated (GEP-4894) in favor of the
      # Backend resource, but NGF keeps honoring it until that field is supported on Backend
      # (nginx/nginx-gateway-fabric#5860). Drop this rule once route-level support is removed.
      - linters:
          - staticcheck
        text: >-
          SA1019: .*RouteRule\)\.SessionPersistence is deprecated: use the Backend resource for
          session persistence \(GEP-4894\)
        description: >-
          Route-level sessionPersistence deprecation is accepted until Backend-level support
          lands in #5860.
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/nginx/nginx-gateway-fabric
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
