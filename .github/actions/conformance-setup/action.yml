name: Setup Conformance Test Environment
description: >
  Builds the NGF, NGINX, and conformance test-runner Docker images, provisions
  a kind cluster, loads the images into it, and installs NGF via Helm. Used to
  share setup between the standard and inference conformance test jobs so they
  can run in parallel without duplicating step definitions.

inputs:
  image:
    description: Image variant to build (nginx or plus)
    required: true
  build-os:
    description: Build OS suffix (e.g. ubi), empty for default
    required: false
    default: ''
  k8s-version:
    description: kind node image k8s version
    required: true
  cluster-name:
    description: Name to give the kind cluster
    required: true
  production-release:
    description: Whether this is a production release ('true'/'false')
    required: false
    default: 'false'
  release_version:
    description: Release version, used for docker metadata tagging
    required: false
    default: ''
  image-source:
    description: >
      Where the NGF and NGINX images come from. `build` builds them here and
      loads them into kind, which is what everything does today. `registry`
      pulls already-built images so a release can be tested with the artifacts
      it will ship. The conformance runner image is built either way: it is
      test scaffolding, not something we release.
    required: false
    default: build
  image-registry:
    description: >
      The NGF image repository to pull from, host included. Required when
      image-source is registry.
    required: false
    default: ''
  image-tag:
    description: Tag to pull. Required when image-source is registry.
    required: false
    default: ''

outputs:
  ngf-version:
    description: The resolved NGF docker metadata version tag
    value: ${{ steps.ngf-meta.outputs.version }}

runs:
  using: composite
  steps:
    # Fail before the cluster exists rather than at a helm install with an
    # empty image repository.
    - name: Check the registry source is fully specified
      if: ${{ inputs.image-source == 'registry' }}
      shell: bash
      run: |
        test -n "${{ inputs.image-registry }}" || echo "::error::image-registry is required when image-source is registry"
        test -n "${{ inputs.image-registry }}" || exit 1
        test -n "${{ inputs.image-tag }}" || echo "::error::image-tag is required when image-source is registry"
        test -n "${{ inputs.image-tag }}" || exit 1

    - name: Setup Golang Environment
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable

    - name: Set GOPATH
      shell: bash
      run: echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV

    - name: Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: NGF Docker meta
      id: ngf-meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: |
          name=ghcr.io/nginx/nginx-gateway-fabric
        tags: |
          type=semver,pattern={{version}},suffix=${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
          type=edge,suffix=${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
          type=schedule,suffix=${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
          type=ref,event=pr,suffix=${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
          type=ref,event=branch,suffix=-rc${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }},enable=${{ startsWith(github.ref, 'refs/heads/release') && inputs.production-release != 'true' }}
          type=raw,value=${{ inputs.release_version }},enable=${{ inputs.production-release == 'true' && inputs.release_version != '' }},suffix=${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}

    - name: NGINX Docker meta
      id: nginx-meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: |
          name=ghcr.io/nginx/nginx-gateway-fabric/${{ inputs.image == 'plus' && 'nginx-plus' || inputs.image }}
        tags: |
          type=semver,pattern={{version}},suffix=${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
          type=edge,suffix=${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
          type=schedule,suffix=${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
          type=ref,event=pr,suffix=${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
          type=ref,event=branch,suffix=-rc${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }},enable=${{ startsWith(github.ref, 'refs/heads/release') && inputs.production-release != 'true' }}
          type=raw,value=${{ inputs.release_version }},enable=${{ inputs.production-release == 'true' && inputs.release_version != '' }},suffix=${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}

    - name: Build binary
      if: ${{ inputs.image-source == 'build' }}
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        version: v2.18.2 # renovate: datasource=github-tags depName=goreleaser/goreleaser
        args: build --single-target --snapshot --clean
      env:
        TELEMETRY_ENDPOINT: "" # disables sending telemetry
        TELEMETRY_ENDPOINT_INSECURE: "false"

    - name: Build NGF Docker Image
      if: ${{ inputs.image-source == 'build' }}
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        file: build/Dockerfile
        tags: ${{ steps.ngf-meta.outputs.tags }}
        context: "."
        target: goreleaser
        load: true
        cache-from: type=gha,scope=ngf
        pull: true

    - name: Build NGINX Docker Image
      if: ${{ inputs.image-source == 'build' }}
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        file: build${{ inputs.build-os != '' && format('/{0}', inputs.build-os) || '' }}/Dockerfile${{ inputs.image == 'nginx' && '.nginx' || '' }}${{ inputs.image == 'plus' && '.nginxplus' || '' }}
        tags: ${{ steps.nginx-meta.outputs.tags }}
        context: "."
        load: true
        cache-from: type=gha,scope=${{ inputs.image }}${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
        pull: true
        build-args: |
          NJS_DIR=internal/controller/nginx/modules/src
          NGINX_CONF_DIR=internal/controller/nginx/conf
          BUILD_AGENT=gha
        secret-envs: |
          ${{ contains(inputs.image, 'plus') && 'nginx-repo.crt=NGINX_CRT' || '' }}
          ${{ contains(inputs.image, 'plus') && 'nginx-repo.key=NGINX_KEY' || '' }}

    - name: Update Test Go Modules
      if: ${{ github.event_name == 'schedule' }}
      shell: bash
      run: make update-go-modules
      working-directory: ./tests

    - name: Build Test Docker Image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        file: tests/conformance/Dockerfile
        tags: conformance-test-runner:${{ github.sha }}
        context: "."
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
        pull: true

    - name: Deploy Kubernetes
      id: k8s
      shell: bash
      run: kind create cluster --name ${{ inputs.cluster-name }} --image=kindest/node:${{ inputs.k8s-version }}

    # Only images built here are on the node. A registry source is pulled by
    # the kubelet, which is why PULL_POLICY moves with IMAGE_SOURCE and why
    # the pull secret below exists.
    - name: Load images into Kubernetes
      if: ${{ inputs.image-source == 'build' }}
      shell: bash
      run: kind load docker-image ${{ join(fromJSON(steps.ngf-meta.outputs.json).tags, ' ') }} ${{ join(fromJSON(steps.nginx-meta.outputs.json).tags, ' ') }} --name ${{ inputs.cluster-name }}

    - name: Setup license file for plus
      if: ${{ inputs.image == 'plus' }}
      shell: bash
      run: echo "${PLUS_LICENSE}" > license.jwt

    # The registry host is taken from the repository the images are pulled
    # from, so the credential cannot be built for somewhere else.
    - name: Create the image pull secret
      if: ${{ inputs.image-source == 'registry' }}
      shell: bash
      env:
        IMAGE_REGISTRY: ${{ inputs.image-registry }}
      run: |
        echo "${JWT_PLUS_WAF_REGISTRY}" > dockerconfig.jwt
        make create-image-pull-secret NGINX_IMAGE_PULL_SERVER="${IMAGE_REGISTRY%%/*}"
      working-directory: ./tests

    - name: Setup conformance tests
      shell: bash
      run: |
        ngf_prefix="${{ inputs.image-source == 'registry' && inputs.image-registry || 'ghcr.io/nginx/nginx-gateway-fabric' }}"
        ngf_tag="${{ inputs.image-source == 'registry' && inputs.image-tag || steps.ngf-meta.outputs.version }}"
        if [ "${{ github.event_name }}" == "schedule" ]; then export GW_API_VERSION=main; fi
        make helm-install-local${{ inputs.image == 'plus' && '-with-plus' || ''}} PREFIX=${ngf_prefix} TAG=${ngf_tag} IMAGE_SOURCE=${{ inputs.image-source }}
      working-directory: ./tests
