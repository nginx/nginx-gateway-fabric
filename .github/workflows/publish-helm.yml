name: Publish Helm Chart

on:
  workflow_call:
    inputs:
      oci_registries:
        description: |
          Comma-separated oci:// URLs to push the packaged chart to.
        required: false
        type: string
        default: "oci://ghcr.io/nginx/charts"
      app_version:
        description: |
          Overrides the chart's appVersion. Empty packages the chart as it is
          in the tree, which is what a release does.
        required: false
        type: string
        default: ""
      chart_version:
        description: |
          Overrides the chart version. Empty packages the chart as it is in the
          tree, which is what a release does.
        required: false
        type: string
        default: ""
      dry_run:
        description: Package the chart but do not push it.
        required: false
        type: boolean
        default: false
      runner:
        required: false
        type: string
        default: "ubuntu-24.04"

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  publish:
    name: Package and Publish Helm Chart
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write # for helm to push to GHCR
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # Checked up front, so an unsupported registry fails before the chart is
      # built rather than part-way through pushing.
      - name: Check every requested registry can be authenticated
        env:
          OCI_REGISTRIES: ${{ inputs.oci_registries }}
        run: |
          set -euo pipefail
          status=0
          IFS=',' read -ra registries <<<"${OCI_REGISTRIES}"
          for registry in "${registries[@]}"; do
          registry="$(echo "${registry}" | tr -d '[:space:]')"
          [ -n "${registry}" ] || continue
          case "${registry}" in
          oci://ghcr.io/*) ;;
          oci://*)
          echo "error: no login is configured for ${registry}." >&2
          echo "Add a login step to publish-helm.yml before pushing there." >&2
          status=1
          ;;
          *)
          echo "error: '${registry}' is not an oci:// URL." >&2
          status=1
          ;;
          esac
          done
          exit "${status}"

      # Gated on github.repository rather than the owner: the private
      # mirror reports the same owner, and ghcr.io is public. Only the
      # login and the push are gated, not the whole job, so packaging the
      # chart stays available anywhere it is useful.
      - name: Login to GitHub Container Registry
        if: ${{ github.repository == 'nginx/nginx-gateway-fabric' && contains(inputs.oci_registries, 'oci://ghcr.io/') }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package
        id: package
        env:
          APP_VERSION: ${{ inputs.app_version }}
          CHART_VERSION: ${{ inputs.chart_version }}
        run: |
          set -euo pipefail
          args=()
          [ -n "${APP_VERSION}" ] && args+=(--app-version "${APP_VERSION}")
          [ -n "${CHART_VERSION}" ] && args+=(--version "${CHART_VERSION}")
          output=$(helm package "${args[@]+"${args[@]}"}" charts/nginx-gateway-fabric)
          echo "path=$(basename -- "$(echo "${output}" | cut -d: -f2)")" >> "$GITHUB_OUTPUT"

      - name: Push
        if: ${{ github.repository == 'nginx/nginx-gateway-fabric' && !inputs.dry_run }}
        env:
          OCI_REGISTRIES: ${{ inputs.oci_registries }}
          CHART_PATH: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail
          IFS=',' read -ra registries <<<"${OCI_REGISTRIES}"
          for registry in "${registries[@]}"; do
          registry="$(echo "${registry}" | tr -d '[:space:]')"
          [ -n "${registry}" ] || continue
          echo "Pushing ${CHART_PATH} to ${registry}"
          helm push "${CHART_PATH}" "${registry}"
          done
