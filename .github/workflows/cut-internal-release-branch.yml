name: Cut Internal Release Branch

# Creates internal/release-X.Y in the release mirror, from the synced copy of
# the public release-X.Y.
#
# Cutting from the synced tip rather than from anything else is what makes the
# release-day push a fast-forward. This asserts that precondition instead of
# relying on the release owner to have waited for the sync: it refuses to
# branch unless the synced copy is identical to the public tip.
#
# Runs only in the mirror. Reading the public repository needs no privileged
# credential, and the branch is created with the mirror's own GITHUB_TOKEN, so
# nothing here points a credential from public to private.

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: The public release branch to cut from, for example release-2.8
        required: true
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  cut:
    name: Cut the internal release branch
    runs-on: ubuntu-24.04
    if: github.repository == vars.INTERNAL_REPOSITORY
    permissions:
      contents: write # to create the internal release branch
    steps:
      - name: Check the branch name
        env:
          RELEASE_BRANCH: ${{ inputs.release_branch }}
        run: |
          echo "${RELEASE_BRANCH}" | grep -Eq '^release-[0-9]+\.[0-9]+$' || echo "::error::release_branch must look like release-X.Y, got '${RELEASE_BRANCH}'"
          echo "${RELEASE_BRANCH}" | grep -Eq '^release-[0-9]+\.[0-9]+$' || exit 1

      - name: Checkout the mirror
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The sync copies public branches into the mirror on a timer, so the
      # synced copy can lag. Comparing against the public tip is the whole
      # point of this workflow: branching from a stale copy is what would make
      # the release-day fast-forward fail, long after it is cheap to fix.
      - name: Compare the synced branch with the public tip
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
          PUBLIC_REPOSITORY: nginx/nginx-gateway-fabric
        run: |
          public_sha=$(gh api "repos/${PUBLIC_REPOSITORY}/commits/${RELEASE_BRANCH}" --jq .sha 2>/dev/null || true)
          test -n "${public_sha}" || echo "::error::${RELEASE_BRANCH} does not exist in ${PUBLIC_REPOSITORY}; cut it there first"
          test -n "${public_sha}" || exit 1
          synced_sha=$(git rev-parse --verify --quiet "origin/${RELEASE_BRANCH}" || true)
          test -n "${synced_sha}" || echo "::error::${RELEASE_BRANCH} has not been synced into this repository yet; wait for the sync"
          test -n "${synced_sha}" || exit 1
          echo "public ${public_sha}"
          echo "synced ${synced_sha}"
          test "${public_sha}" = "${synced_sha}" || echo "::error::the synced copy of ${RELEASE_BRANCH} is behind the public tip; wait for the sync and re-run"
          test "${public_sha}" = "${synced_sha}" || exit 1
          echo "sha=${synced_sha}" >> "$GITHUB_OUTPUT"

      # Never move an existing internal branch. Prep may already have built
      # from it, and a staged artifact that no longer corresponds to a commit
      # is worse than a failed dispatch.
      - name: Refuse to move an existing internal branch
        env:
          INTERNAL_BRANCH: internal/${{ inputs.release_branch }}
        run: |
          git rev-parse --verify --quiet "origin/${INTERNAL_BRANCH}" > /dev/null && exists=yes || exists=no
          test "${exists}" = "no" || echo "::error::${INTERNAL_BRANCH} already exists; delete it deliberately if you really mean to recut"
          test "${exists}" = "no" || exit 1
          echo "${INTERNAL_BRANCH} does not exist yet"

      - name: Create the internal release branch
        env:
          INTERNAL_BRANCH: internal/${{ inputs.release_branch }}
          SHA: ${{ steps.compare.outputs.sha }}
        run: |
          git branch "${INTERNAL_BRANCH}" "${SHA}"
          git push origin "${INTERNAL_BRANCH}"
          echo "::notice::created ${INTERNAL_BRANCH} at ${SHA}"
