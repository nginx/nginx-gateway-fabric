name: Functional Testing

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      k8s-version:
        required: true
        type: string
      build-os:
        required: false
        type: string
        default: ''
      image-source:
        description: |
          Where the NGF and NGINX images come from. `build` builds them from
          this checkout and loads them into kind, which is what pull requests
          do and what everything does today. `registry` pulls the images
          release prep staged, so a release is tested with the artifacts it
          will actually ship rather than with a rebuild of them. The staging
          registry is read from the vault, not passed in, so no log names it.
        required: false
        type: string
        default: build
      image-tag:
        description: |
          Base tag to pull, without a build-os suffix. Required when
          image-source is registry, ignored otherwise. The suffix is applied
          here from build-os, exactly as the build path applies it when it
          tags what it built: a ubi leg pulls `<tag>-ubi`. Callers pass the
          bare version so the two paths cannot disagree about the convention.
        required: false
        type: string
        default: ''
      runner:
        description: |
          Runner label for the test jobs. Release prep passes the mirror's
          internal runner, which can reach the staging registry; everything
          else keeps the default.
        required: false
        type: string
        default: ubuntu-26.04

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  functional-tests:
    name: Run Tests
    runs-on: ${{ inputs.runner }}
    if: ${{ !github.event.pull_request.head.repo.fork || !contains(inputs.image, 'plus') }}
    permissions:
      contents: read
      id-token: write # for get-from-vault to authenticate with Azure
    env:
      DOCKER_BUILD_SUMMARY: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Also needed for a registry source: those images are pulled from an
      # NGINX registry even when nothing about the run is Plus.
      - name: Get secrets
        if: ${{ contains(inputs.image, 'plus') || inputs.image-source == 'registry' }}
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@2ac905a974d15594f0e03697b4f88916fbb3694d
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.AZ_VAULT_NAME }}
          secret-names: "jwt-plus-reporting-endpoint,jwt-plus-exception-reporting,jwt-plus-waf-registry${{ inputs.image-source == 'registry' && ',staging-read-registry' || '' }}"
          env-names: "PLUS_USAGE_ENDPOINT,PLUS_LICENSE,JWT_PLUS_WAF_REGISTRY${{ inputs.image-source == 'registry' && ',STAGING_READ_REGISTRY' || '' }}"

      - name: Get secrets from common vault
        if: ${{ contains(inputs.image, 'plus') }}
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@2ac905a974d15594f0e03697b4f88916fbb3694d
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.AZ_COMMON_VAULT_NAME }}
          secret-names: "nginx-pkg-certificate,nginx-pkg-key"
          env-names: "NGINX_CRT,NGINX_KEY"

      - name: Setup Golang Environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Set GOPATH
        run: echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV

      - name: Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: NGF Docker meta
        id: ngf-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            name=ghcr.io/nginx/nginx-gateway-fabric
          tags: |
            type=semver,pattern={{version}},suffix=${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
            type=schedule,suffix=${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
            type=edge,suffix=${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
            type=ref,event=pr,suffix=${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
            type=ref,event=branch,suffix=-rc${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }},enable=${{ startsWith(github.ref, 'refs/heads/release') }}

      - name: NGINX Docker meta
        id: nginx-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            name=ghcr.io/nginx/nginx-gateway-fabric/${{ contains(inputs.image, 'plus') && 'nginx-plus' || inputs.image }}
          tags: |
            type=semver,pattern={{version}},suffix=${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
            type=schedule,suffix=${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
            type=edge,suffix=${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
            type=ref,event=pr,suffix=${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
            type=ref,event=branch,suffix=-rc${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }},enable=${{ startsWith(github.ref, 'refs/heads/release') }}

      # Fail before the cluster exists rather than at ImagePullBackOff.
      - name: Check the registry source is fully specified
        if: ${{ inputs.image-source == 'registry' }}
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          test -n "${IMAGE_TAG}" || echo "::error::image-tag is required when image-source is registry"
          test -n "${IMAGE_TAG}" || exit 1

      - name: Build binary
        if: ${{ inputs.image-source == 'build' }}
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2 # renovate: datasource=github-tags depName=goreleaser/goreleaser
          args: build --single-target --snapshot --clean
        env:
          TELEMETRY_ENDPOINT: otel-collector-opentelemetry-collector.collector.svc.cluster.local:4317
          TELEMETRY_ENDPOINT_INSECURE: "true"

      - name: Build NGF Docker Image
        if: ${{ inputs.image-source == 'build' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: build/Dockerfile
          tags: ${{ steps.ngf-meta.outputs.tags }}
          context: "."
          load: true
          cache-from: type=gha,scope=ngf
          pull: true
          target: goreleaser

      - name: Build NGINX Docker Image
        if: ${{ inputs.image-source == 'build' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: build${{ inputs.build-os != '' && format('/{0}', inputs.build-os) || '' }}/Dockerfile${{ inputs.image == 'nginx' && '.nginx' || '' }}${{ contains(inputs.image, 'plus') && '.nginxplus' || '' }}
          tags: ${{ steps.nginx-meta.outputs.tags }}
          context: "."
          load: true
          cache-from: type=gha,scope=${{ inputs.image }}${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
          pull: true
          build-args: |
            NJS_DIR=internal/controller/nginx/modules/src
            NGINX_CONF_DIR=internal/controller/nginx/conf
            BUILD_AGENT=gha
            ${{ inputs.image == 'plus-waf' && 'INCLUDE_NAP_WAF=true' || '' }}
          secret-envs: |
            ${{ contains(inputs.image, 'plus') && 'nginx-repo.crt=NGINX_CRT' || '' }}
            ${{ contains(inputs.image, 'plus') && 'nginx-repo.key=NGINX_KEY' || '' }}

      - name: Setup license file for plus
        if: ${{ contains(inputs.image, 'plus') }}
        run: echo "${PLUS_LICENSE}" > license.jwt

      # Also needed for any registry source, to authenticate the pull.
      - name: Setup registry JWT
        if: ${{ inputs.image == 'plus-waf' || inputs.image-source == 'registry' }}
        run: echo "${JWT_PLUS_WAF_REGISTRY}" > dockerconfig.jwt

      # What the suites below install, for either source. Written to the job's
      # environment rather than step outputs: for a registry source they name
      # the staging registry, which is masked, and the runner drops a masked
      # value from an output. The repository is the staging registry's
      # nginx-gateway-fabric path, the one build.yml pushed to, and the
      # build-os suffix is composed here, so a ubi leg can't silently pull the
      # un-suffixed (Alpine) tag.
      - name: Resolve the images under test
        env:
          IMAGE_SOURCE: ${{ inputs.image-source }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          BUILD_OS: ${{ inputs.build-os }}
          BUILT_VERSION: ${{ steps.ngf-meta.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${IMAGE_SOURCE}" = "registry" ]; then
          registry="${STAGING_READ_REGISTRY%/}"
          prefix="${registry}/nginx-gateway-fabric"
          tag="${IMAGE_TAG}${BUILD_OS:+-${BUILD_OS}}"
          host="${registry%%/*}"
          else
          prefix="ghcr.io/nginx/nginx-gateway-fabric"
          tag="${BUILT_VERSION}"
          host="private-registry.nginx.com"
          fi
          {
          echo "NGF_PREFIX=${prefix}"
          echo "NGF_TAG=${tag}"
          echo "PULL_HOST=${host}"
          } >> "$GITHUB_ENV"

      - name: Login to NGINX private registry
        if: ${{ inputs.image == 'plus-waf' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.PULL_HOST }}
          username: ${{ env.JWT_PLUS_WAF_REGISTRY }}
          password: none

      # The compiler follows the images. Staged NGINX packages compiled with a
      # production WAF compiler would test a combination that never ships.
      - name: Compile WAF policy bundles
        if: ${{ inputs.image == 'plus-waf' }}
        run: make compile-waf-bundles-ci NGINX_IMAGE_PULL_SERVER="${PULL_HOST}"
        working-directory: ./tests

      - name: Install cloud-provider-kind
        run: |
          CLOUD_PROVIDER_KIND_VERSION=v0.11.1 # renovate: datasource=github-tags depName=kubernetes-sigs/cloud-provider-kind
          go install sigs.k8s.io/cloud-provider-kind@${CLOUD_PROVIDER_KIND_VERSION}

      - name: Run cloud-provider-kind
        run: $(go env GOPATH)/bin/cloud-provider-kind & > cloud-provider-kind.log 2>&1

      - name: Deploy Kubernetes
        id: k8s
        run: kind create cluster --name ${{ github.run_id }} --image=kindest/node:${{ inputs.k8s-version }}

      # Only images built here exist on the node; a registry source is pulled
      # by the kubelet instead.
      - name: Load images into Kubernetes
        if: ${{ inputs.image-source == 'build' }}
        run: kind load docker-image ${{ join(fromJSON(steps.ngf-meta.outputs.json).tags, ' ') }} ${{ join(fromJSON(steps.nginx-meta.outputs.json).tags, ' ') }} --name ${{ github.run_id }}

      # Skipped for a registry source: staged images are built to report to
      # the external dev telemetry endpoint, not the in-cluster collector this
      # test deploys, so the test could never observe them.
      - name: Run functional telemetry tests
        if: ${{ inputs.image != 'plus-waf' && inputs.image-source == 'build' }}
        run: |
          make test${{ inputs.image == 'plus' && '-with-plus' || ''}} PREFIX="${NGF_PREFIX}" TAG="${NGF_TAG}" GINKGO_LABEL=telemetry GW_SERVICE_TYPE=LoadBalancer CLUSTER_NAME=${{ github.run_id }} CI=true IMAGE_SOURCE=${{ inputs.image-source }}
        working-directory: ./tests

      - name: Run functional graceful-recovery tests
        if: ${{ inputs.image != 'plus-waf' }}
        run: |
          make test${{ inputs.image == 'plus' && '-with-plus' || ''}} PREFIX="${NGF_PREFIX}" TAG="${NGF_TAG}" GINKGO_LABEL=graceful-recovery GW_SERVICE_TYPE=LoadBalancer CLUSTER_NAME=${{ github.run_id }} CI=true IMAGE_SOURCE=${{ inputs.image-source }} GINKGO_PROCS=2
        working-directory: ./tests

      - name: Run functional tests
        if: ${{ inputs.image != 'plus-waf' }}
        run: |
          make test${{ inputs.image == 'plus' && '-with-plus' || ''}} PREFIX="${NGF_PREFIX}" TAG="${NGF_TAG}" GW_SERVICE_TYPE=LoadBalancer CLUSTER_NAME=${{ github.run_id }} CI=true IMAGE_SOURCE=${{ inputs.image-source }}
        working-directory: ./tests

      # The local WAF build is tagged nginx-plus above, but staging publishes
      # it as nginx-plus-f5waf (see resolve-image-target.sh), so the NGINX
      # repository depends on where the image comes from.
      - name: Run WAF tests
        if: ${{ inputs.image == 'plus-waf' }}
        run: |
          nginx_plus_prefix="${NGF_PREFIX}/${{ inputs.image-source == 'registry' && 'nginx-plus-f5waf' || 'nginx-plus' }}"
          make test-waf PREFIX="${NGF_PREFIX}" TAG="${NGF_TAG}" NGINX_PLUS_PREFIX="${nginx_plus_prefix}" GW_SERVICE_TYPE=LoadBalancer CLUSTER_NAME=${{ github.run_id }} CI=true IMAGE_SOURCE=${{ inputs.image-source }}
        working-directory: ./tests
