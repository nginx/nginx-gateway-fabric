name: Conformance Testing

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      build-os:
        required: false
        type: string
        default: ''
      k8s-version:
        required: true
        type: string
      enable-experimental:
        required: true
        type: boolean
      enable-inference-extension:
        required: true
        type: boolean
      production-release:
        required: false
        type: boolean
        default: false
      release_version:
        required: false
        type: string
        default: ''
      keep-profile:
        description: |
          Keep this run's conformance profile as an artifact. Only one run's
          profile is kept, because it is what gets attached to a release and
          the matrix produces identical profiles unless conformance failed.
        required: false
        type: boolean
        default: true
      image-source:
        description: |
          Where the NGF and NGINX images come from. `build` builds them and
          loads them into kind, which is what pull requests do. `registry`
          pulls already-built images so a release can be tested with the
          artifacts it will ship.
        required: false
        type: string
        default: build
      image-registry:
        description: |
          The NGF image repository to pull from, host included. Required when
          image-source is registry, ignored otherwise.
        required: false
        type: string
        default: ''
      image-tag:
        description: |
          Tag to pull. Required when image-source is registry, ignored
          otherwise.
        required: false
        type: string
        default: ''

defaults:
  run:
    shell: bash

env:
  ENABLE_EXPERIMENTAL: ${{ inputs.enable-experimental }}
  ENABLE_INFERENCE_EXTENSION: ${{ inputs.enable-inference-extension }}

permissions:
  contents: read

jobs:
  conformance-tests:
    name: Run Tests
    runs-on: ubuntu-24.04
    if: ${{ !github.event.pull_request.head.repo.fork || inputs.image != 'plus' }}
    permissions:
      contents: read
      id-token: write # for get-from-vault to authenticate with Azure
    env:
      DOCKER_BUILD_SUMMARY: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get secrets
        if: ${{ inputs.image == 'plus' || inputs.image-source == 'registry' }}
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@2ac905a974d15594f0e03697b4f88916fbb3694d
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.AZ_VAULT_NAME }}
          secret-names: "jwt-plus-reporting-endpoint,jwt-plus-exception-reporting,jwt-plus-waf-registry"
          env-names: "PLUS_USAGE_ENDPOINT,PLUS_LICENSE,JWT_PLUS_WAF_REGISTRY"

      - name: Get secrets from common vault
        if: ${{ inputs.image == 'plus' }}
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@2ac905a974d15594f0e03697b4f88916fbb3694d
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.AZ_COMMON_VAULT_NAME }}
          secret-names: "nginx-pkg-certificate,nginx-pkg-key"
          env-names: "NGINX_CRT,NGINX_KEY"

      - name: Setup conformance environment
        id: setup
        uses: ./.github/actions/conformance-setup
        with:
          image: ${{ inputs.image }}
          build-os: ${{ inputs.build-os }}
          k8s-version: ${{ inputs.k8s-version }}
          cluster-name: ${{ github.run_id }}
          production-release: ${{ inputs.production-release }}
          release_version: ${{ inputs.release_version }}
          image-source: ${{ inputs.image-source }}
          image-registry: ${{ inputs.image-registry }}
          image-tag: ${{ inputs.image-tag }}

      - name: Run conformance tests
        run: |
          make run-conformance-tests CONFORMANCE_TAG=${{ github.sha }} NGF_VERSION=${{ github.ref_name }} CLUSTER_NAME=${{ github.run_id }}
          core_result=$(cat conformance-profile.yaml | yq '.profiles[0].core.result')
          extended_result=$(cat conformance-profile.yaml | yq '.profiles[0].extended.result')
          if [ "${core_result}" == "failure" ] || [ "${extended_result}" == "failure" ]; then echo "Conformance test failed, see above for details." && exit 2; fi
        working-directory: ./tests

      - name: Upload profile to GitHub
        if: ${{ inputs.enable-experimental && inputs.keep-profile }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-profile
          path: ./tests/conformance-profile.yaml

  inference-conformance-tests:
    name: Run Inference Tests
    runs-on: ubuntu-24.04
    if: ${{ !github.event.pull_request.head.repo.fork || inputs.image != 'plus' }}
    permissions:
      contents: read
      id-token: write # for get-from-vault to authenticate with Azure
    env:
      DOCKER_BUILD_SUMMARY: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get secrets
        if: ${{ inputs.image == 'plus' || inputs.image-source == 'registry' }}
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@2ac905a974d15594f0e03697b4f88916fbb3694d
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.AZ_VAULT_NAME }}
          secret-names: "jwt-plus-reporting-endpoint,jwt-plus-exception-reporting,jwt-plus-waf-registry"
          env-names: "PLUS_USAGE_ENDPOINT,PLUS_LICENSE,JWT_PLUS_WAF_REGISTRY"

      - name: Get secrets from common vault
        if: ${{ inputs.image == 'plus' }}
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@2ac905a974d15594f0e03697b4f88916fbb3694d
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.AZ_COMMON_VAULT_NAME }}
          secret-names: "nginx-pkg-certificate,nginx-pkg-key"
          env-names: "NGINX_CRT,NGINX_KEY"

      - name: Setup conformance environment
        id: setup
        uses: ./.github/actions/conformance-setup
        with:
          image: ${{ inputs.image }}
          build-os: ${{ inputs.build-os }}
          k8s-version: ${{ inputs.k8s-version }}
          cluster-name: ${{ github.run_id }}-inference
          production-release: ${{ inputs.production-release }}
          release_version: ${{ inputs.release_version }}
          image-source: ${{ inputs.image-source }}
          image-registry: ${{ inputs.image-registry }}
          image-tag: ${{ inputs.image-tag }}

      - name: Run inference conformance tests
        run: |
          make run-inference-conformance-tests CONFORMANCE_TAG=${{ github.sha }} NGF_VERSION=${{ github.ref_name }} CLUSTER_NAME=${{ github.run_id }}-inference
          core_result=$(cat conformance-profile-inference.yaml | yq '.profiles[0].core.result')
          if [ "${core_result}" == "failure" ]; then echo "Inference Conformance test failed, see above for details." && exit 2; fi
        working-directory: ./tests

      - name: Upload profile to GitHub
        if: ${{ inputs.enable-experimental && inputs.keep-profile }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-profile-inference
          path: ./tests/conformance-profile-inference.yaml
