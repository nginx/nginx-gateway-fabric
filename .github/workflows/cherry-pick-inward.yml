name: Cherry-pick Inward

# Brings merged, labelled public pull requests onto the internal release
# branch and opens a pull request with the result. This is the only way a fix
# reaches a release branch: public release-X.Y moves only when promote
# fast-forwards it.
#
# It runs from the mirror because reading the public repository needs no
# privileged credential, whereas pushing from there into the mirror would need
# one this design refuses to create. Dispatch-only, so the release owner
# decides when fixes move.

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: The release branch to pick into, for example release-2.8
        required: true
        type: string
      dry_run:
        description: Report what would be picked and change nothing
        required: false
        type: boolean
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  cherry-pick-inward:
    name: Cherry-pick into the internal release branch
    runs-on: ubuntu-26.04
    if: github.repository == vars.INTERNAL_REPOSITORY
    permissions:
      contents: write # to push the cherry-pick branch
      pull-requests: write # to open the pull request
    steps:
      - name: Checkout the mirror
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure the committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cherry-pick inward
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
        # Not ${DRY_RUN:+--dry-run}: a false boolean input is the string
        # "false", which is non-empty, so that shape would always dry-run.
        run: .github/scripts/cherry-pick-inward.sh --release-branch "${RELEASE_BRANCH}" ${{ inputs.dry_run && '--dry-run' || '' }}
