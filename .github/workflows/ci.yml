name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  schedule:
    - cron: "0 3 * * *" # run every day at 3am UTC (nightly builds)
  # No inputs. Releases are not built here any more: prep builds them in
  # the private mirror and publish promotes them from the public repository.
  # A manual dispatch re-runs CI on a branch and nothing else.
  workflow_dispatch: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.ref_name }}-ci
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vars:
    name: Checks and variables
    runs-on: ubuntu-24.04
    outputs:
      go_path: ${{ steps.vars.outputs.go_path }}
      min_k8s_version: ${{ steps.vars.outputs.min_k8s_version }}
      k8s_latest: ${{ steps.vars.outputs.k8s_latest }}
      helm_changes: ${{ steps.filter.outputs.charts }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Golang Environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            tests/go.sum

      - name: Check for changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            charts:
            - charts/nginx-gateway-fabric/**/*
            rbac:
            - operators/**/*
            - charts/nginx-gateway-fabric/**/*

      - name: Output Variables
        id: vars
        run: |
          K8S_KIND_VERSION=v1.37.0 # renovate: datasource=docker depName=kindest/node
          echo "go_path=$(go env GOPATH)" >> $GITHUB_OUTPUT
          echo "min_k8s_version=v1.32.11" >> $GITHUB_OUTPUT
          echo "k8s_latest=${K8S_KIND_VERSION}" >> $GITHUB_OUTPUT

      - name: Check if go.mod and go.sum are up to date
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

      - name: Check if go.mod and go.sum are up to date in tests
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
        working-directory: tests

      - name: Check if all the generated files are up to date
        run: make generate-all && git diff --exit-code

      - name: Verify Operator RBAC Synchronization
        if: steps.filter.outputs.rbac == 'true'
        run: ./operators/scripts/verify-rbac-sync.sh

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    needs: vars
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Golang Environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            tests/go.sum

      - name: Run Tests
        run: make unit-test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Coverage Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cover-${{ github.run_id }}.html
          path: ${{ github.workspace }}/cover.html
        if: always()

  njs-unit-tests:
    name: NJS Unit Tests
    runs-on: ubuntu-24.04
    needs: vars
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js Environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: internal/controller/nginx/modules/package-lock.json

      - name: Run tests
        run: npm --prefix ${{ github.workspace }}/internal/controller/nginx/modules install-ci-test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  rust-unit-tests:
    name: Rust Unit Tests
    runs-on: ubuntu-24.04
    needs: vars
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests
        run: make rust-unit-test

  binary:
    name: Build Binary
    runs-on: ${{ github.repository_owner == 'nginx' && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && 'ubuntu-24.04-amd64' || 'ubuntu-24.04' }}
    # Run in parallel with tests - they're independent validations
    needs: [vars]
    if: github.repository == 'nginx/nginx-gateway-fabric'
    permissions:
      contents: read
      id-token: write # for get-from-vault to authenticate with Azure
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get secrets from common vault
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@2ac905a974d15594f0e03697b4f88916fbb3694d
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.AZ_COMMON_VAULT_NAME }}
          # The production Artifactory URL is no longer fetched here: only a
          # release used it, and releases are built by prep in the mirror.
          secret-names: "artifactory-service-user-nginx,artifactory-service-user-nginx-token,artifactory-go-url-dev"
          env-names: "ARTIFACTORY_USER,ARTIFACTORY_TOKEN,ARTIFACTORY_DEV_URL"

      - name: Configure GOPROXY
        id: goproxy
        run: |
          if [[ "${ARTIFACTORY_USER}" != "" ]] && [[ ("${{ github.event_name }}" == "push" || "${{ github.event_name }}" == "schedule") && "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "Dev mode - using dev Artifactory"
          GOPROXY_VALUE="https://${ARTIFACTORY_USER}:${ARTIFACTORY_TOKEN}@${ARTIFACTORY_DEV_URL}"
          else
          echo "Using direct GOPROXY"
          GOPROXY_VALUE="proxy.golang.org,direct"
          fi
          echo "GOPROXY=${GOPROXY_VALUE}" >> $GITHUB_ENV

      - name: Setup Golang Environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            tests/go.sum

      - name: Set Go module cache
        run: |
          mkdir -p ${{ github.workspace }}/.gocache
          echo "GOMODCACHE=${{ github.workspace }}/.gocache" >> $GITHUB_ENV
          echo "GOCACHE=${{ github.workspace }}/.gocache" >> $GITHUB_ENV

      - name: Build binary
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2 # renovate: datasource=github-tags depName=goreleaser/goreleaser
          # Always a build, never a release: CI produces binaries for the
          # image builds and nothing else. Release prep runs the release pipe.
          #
          # On PRs: one target for speed, since tests run on amd64.
          args: ${{ github.event_name == 'pull_request' && 'build --single-target --snapshot' || 'build --snapshot' }} --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOPATH: ${{ needs.vars.outputs.go_path }}
          TELEMETRY_ENDPOINT: oss.edge.df.f5.com:443
          TELEMETRY_ENDPOINT_INSECURE: "false"
          # Always empty here, which keeps CI builds stamped "edge". See
          # snapshot.version_template in .goreleaser.yml. Prep stamps the real
          # version.
          NGF_VERSION: ""

      # Read from dist/metadata.json: -trimpath keeps the ldflags out of the
      # binaries' build info, so the stamp cannot be read back from them.
      - name: Assert the build is stamped with the expected version
        env:
          EXPECT_VERSION: edge
          DIST_DIR: ${{ github.workspace }}/dist
        run: .github/scripts/assert-binary-version.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ github.run_id }}
          path: ${{ github.workspace }}/dist
          retention-days: 1

  build-oss:
    name: Build OSS images
    needs: [vars, binary]
    if: github.repository == 'nginx/nginx-gateway-fabric'
    strategy:
      fail-fast: false
      matrix:
        image: [ngf, nginx]
        # On PRs: build only amd64 for speed (tests run on amd64)
        # On main/release: build both amd64 and arm64
        platforms: ${{ github.event_name == 'pull_request' && fromJSON('["linux/amd64"]') || fromJSON('["linux/arm64, linux/amd64"]') }}
        # On PRs: only standard OS (2 jobs)
        # On main/release: include ubi (4 jobs)
        build-os: ${{ github.event_name == 'pull_request' && fromJSON('[""]') || fromJSON('["", "ubi"]') }}
    uses: ./.github/workflows/build.yml
    with:
      image: ${{ matrix.image }}
      platforms: ${{ matrix.platforms }}
      build-os: ${{ matrix.build-os }}
      runner: ${{ github.repository_owner == 'nginx' && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && 'ubuntu-24.04-amd64' || 'ubuntu-24.04' }}
    permissions:
      contents: read # for docker/build-push-action to read repo content
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      packages: write # for docker/build-push-action to push to GHCR
      id-token: write # for docker/login to login to NGINX registry
    secrets: inherit

  build-plus:
    name: Build Plus images
    needs: [vars, binary]
    if: github.repository == 'nginx/nginx-gateway-fabric'
    uses: ./.github/workflows/build.yml
    strategy:
      fail-fast: false
      matrix:
        # On PRs: only standard OS (1 job)
        # On main/release: include ubi (2 jobs)
        build-os: ${{ github.event_name == 'pull_request' && fromJSON('[""]') || fromJSON('["", "ubi"]') }}
    with:
      image: plus
      # On PRs: build only amd64 for speed (tests run on amd64)
      # On main/release: build both amd64 and arm64
      platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/arm64, linux/amd64' }}
      build-os: ${{ matrix.build-os }}
      runner: ${{ github.repository_owner == 'nginx' && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && 'ubuntu-24.04-amd64' || 'ubuntu-24.04' }}
    permissions:
      contents: read # for docker/build-push-action to read repo content
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      packages: write # for docker/build-push-action to push to GHCR
      id-token: write # for docker/login to login to NGINX registry
    secrets: inherit

  build-plus-nap-waf:
    name: Build Plus NAP WAF images
    needs: [vars, binary]
    if: github.repository == 'nginx/nginx-gateway-fabric'
    uses: ./.github/workflows/build.yml
    strategy:
      fail-fast: false
      matrix:
        # On PRs: only standard OS (1 job)
        # On main/release: include ubi (2 jobs)
        build-os: ${{ github.event_name == 'pull_request' && fromJSON('[""]') || fromJSON('["", "ubi"]') }}
    with:
      image: plus-nap-waf
      platforms: "linux/amd64"
      build-os: ${{ matrix.build-os }}
      runner: ${{ github.repository_owner == 'nginx' && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && 'ubuntu-24.04-amd64' || 'ubuntu-24.04' }}
    permissions:
      contents: read # for docker/build-push-action to read repo content
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      packages: write # for docker/build-push-action to push to GHCR
      id-token: write # for docker/login to login to NGINX registry
    secrets: inherit

  build-operator:
    name: Build Operator images
    needs: [vars, binary]
    if: github.repository == 'nginx/nginx-gateway-fabric'
    uses: ./.github/workflows/build.yml
    with:
      image: operator
      # On PRs: build only amd64 for speed (tests run on amd64)
      # On main/release: build both amd64 and arm64
      platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/arm64, linux/amd64' }}
      runner: ${{ github.repository_owner == 'nginx' && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && 'ubuntu-24.04-amd64' || 'ubuntu-24.04' }}
    permissions:
      contents: read # for docker/build-push-action to read repo content
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      packages: write # for docker/build-push-action to push to GHCR
      id-token: write # for docker/login to login to NGINX registry
    secrets: inherit

  functional-tests:
    name: Functional tests
    needs: [vars, build-oss, build-plus, build-plus-nap-waf]
    if: github.repository == 'nginx/nginx-gateway-fabric'
    strategy:
      fail-fast: false
      matrix:
        # On PRs: run nginx + plus + waf with latest k8s only (2 jobs)
        # On main/release: run full matrix (8 jobs)
        image: [nginx, plus, plus-waf]
        build-os: ${{ github.event_name == 'pull_request' && fromJSON('[""]') || fromJSON('["", "ubi"]') }}
        k8s-version: ${{ github.event_name == 'pull_request' && fromJSON(format('["{0}"]', needs.vars.outputs.k8s_latest)) || fromJSON(format('["{0}", "{1}"]', needs.vars.outputs.min_k8s_version, needs.vars.outputs.k8s_latest)) }}
    uses: ./.github/workflows/functional.yml
    with:
      image: ${{ matrix.image }}
      k8s-version: ${{ matrix.k8s-version }}
      build-os: ${{ matrix.build-os }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write # for get-from-vault to authenticate with Azure

  conformance-tests:
    name: Conformance tests
    needs: [vars, build-oss, build-plus]
    if: github.repository == 'nginx/nginx-gateway-fabric'
    strategy:
      fail-fast: false
      matrix:
        # On PRs: run latest k8s, experimental enabled (1 job - most coverage)
        # On main/release: run full matrix (16 jobs)
        image: [nginx, plus]
        build-os: ${{ github.event_name == 'pull_request' && fromJSON('[""]') || fromJSON('["", "ubi"]') }}
        k8s-version: ${{ github.event_name == 'pull_request' && fromJSON(format('["{0}"]', needs.vars.outputs.k8s_latest)) || fromJSON(format('["{0}", "{1}"]', needs.vars.outputs.min_k8s_version, needs.vars.outputs.k8s_latest)) }}
        enable-experimental: ${{ github.event_name == 'pull_request' && fromJSON('[true]') || fromJSON('[true, false]') }}
    uses: ./.github/workflows/conformance.yml
    with:
      image: ${{ matrix.image }}
      k8s-version: ${{ matrix.k8s-version }}
      enable-experimental: ${{ matrix.enable-experimental }}
      build-os: ${{ matrix.build-os }}
      enable-inference-extension: true
      # One combination's profile is kept and published: OSS, Alpine, latest
      # Kubernetes. The matrix produces identical profiles unless conformance
      # failed, which fails the job and blocks the release anyway.
      keep-profile: ${{ matrix.image == 'nginx' && matrix.build-os == '' && matrix.k8s-version == needs.vars.outputs.k8s_latest }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write # for get-from-vault to authenticate with Azure

  test-completion:
    name: Functional/Conformance Tests Pass
    if: github.repository == 'nginx/nginx-gateway-fabric' && (always())
    needs: [functional-tests, conformance-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.functional-tests.result }}" == "failure" || "${{ needs.functional-tests.result }}" == "cancelled" ]]; then
          echo "❌ Functional tests ${{ needs.functional-tests.result }}"
          exit 1
          fi
          if [[ "${{ needs.conformance-tests.result }}" == "failure" || "${{ needs.conformance-tests.result }}" == "cancelled" ]]; then
          echo "❌ Conformance tests ${{ needs.conformance-tests.result }}"
          exit 1
          fi
          echo "✅ All tests passed successfully!"

  helm-tests:
    name: Helm Tests
    needs: [vars, build-oss, build-plus]
    strategy:
      fail-fast: false
      matrix:
        image: [nginx, plus]
        k8s-version:
          [
            "${{ needs.vars.outputs.min_k8s_version }}",
            "${{ needs.vars.outputs.k8s_latest }}",
          ]
    uses: ./.github/workflows/helm.yml
    with:
      image: ${{ matrix.image }}
      k8s-version: ${{ matrix.k8s-version }}
    permissions:
      contents: read
      id-token: write # for get-from-vault to authenticate with Azure
    secrets: inherit
    if: ${{ github.repository == 'nginx/nginx-gateway-fabric' && (needs.vars.outputs.helm_changes == 'true' || github.event_name == 'schedule') }}

  publish-helm:
    name: Package and Publish Helm Chart
    needs: [vars, helm-tests]
    if: ${{ github.repository == 'nginx/nginx-gateway-fabric' && (github.ref == 'refs/heads/main') }}
    uses: ./.github/workflows/publish-helm.yml
    with:
      runner: ${{ github.repository_owner == 'nginx' && 'ubuntu-24.04-amd64' || 'ubuntu-24.04' }}
      # Only edge is published from here now. A release ships the chart as
      # it is in the tree, and that is publish's job.
      app_version: edge
      chart_version: 0.0.0-edge
    permissions:
      contents: read
      packages: write # for helm to push to GHCR
    secrets: inherit

  cel-tests:
    name: CEL Tests
    runs-on: ubuntu-24.04
    needs: vars
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Golang Environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            tests/go.sum

      - name: Deploy Kubernetes
        id: k8s
        run: |
          kind create cluster --name ${{ github.run_id }} --image=kindest/node:${{ needs.vars.outputs.k8s_latest }}

      - name: Apply CustomResourceDefinition
        run: |
          kubectl kustomize config/crd | kubectl apply --server-side -f -

      - name: Run Tests
        run: make test-cel-validation
        working-directory: ./tests
