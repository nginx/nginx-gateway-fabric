name: Run build for renovate PRs

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.ref_name }}-renovate
  cancel-in-progress: true

jobs:
  check:
    name: Check for changes
    runs-on: ubuntu-26.04
    outputs:
      generate: ${{ steps.filter.outputs.generate }}
    permissions:
      pull-requests: read
    if: ${{ github.repository == 'nginx/nginx-gateway-fabric' && (github.actor == 'renovate[bot]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            generate:
            - go.mod
            - go.sum
            - Makefile

  # Runs repo scripts and downloaded generators, so it gets no secrets and a read-only token.
  generate:
    name: Build for renovate PRs
    runs-on: ubuntu-26.04
    needs: check
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    if: ${{ github.repository == 'nginx/nginx-gateway-fabric' && (needs.check.outputs.generate == 'true') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Golang Environment
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            tests/go.sum

      # go mod tidy can be removed once https://github.com/renovatebot/renovate/issues/12999 is implemented
      - name: Update files for renovate
        run: |
          make generate-all
          cd tests && go mod tidy && go mod verify

      - name: Create patch
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --cached --binary > "${RUNNER_TEMP}/renovate.patch"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload patch
        if: ${{ steps.diff.outputs.changed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renovate-patch
          path: ${{ runner.temp }}/renovate.patch
          retention-days: 1

  # Holds the App credentials, so it must never run code from the PR (no make, go, or repo scripts).
  push:
    name: Push renovate changes
    runs-on: ubuntu-26.04
    needs: generate
    permissions:
      id-token: write # for get-from-vault to authenticate with Azure
    if: ${{ github.repository == 'nginx/nginx-gateway-fabric' && (github.actor == 'renovate[bot]' && needs.generate.outputs.changed == 'true') }}
    steps:
      - name: Get secrets from vault
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@45e4e50e8dad4382225c8770b5c73109dcfbebc6 # main
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.AZ_COMMON_VAULT_NAME }}
          secret-names: "nginx-bot-renovate-commit-app-client-id, nginx-bot-renovate-commit-app-private-key"
          env-names: "APP_CLIENT_ID, APP_PRIVATE_KEY_B64"

      - name: Decode GitHub App private key
        id: app_key
        run: |
          set +x
          # Mask the raw base64 value
          echo "::add-mask::$APP_PRIVATE_KEY_B64"
          private_key=$(printf '%s' "$APP_PRIVATE_KEY_B64" | base64 -d)
          # Mask every line of the decoded PEM key individually
          while IFS= read -r line; do
            if [[ -n "$line" ]]; then
              echo "::add-mask::$line"
            fi
          done <<< "$private_key"
          delimiter="GHEOF_$(openssl rand -hex 12)"
          {
            echo "private_key<<$delimiter"
            echo "$private_key"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ steps.app_key.outputs.private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app_token.outputs.token }}

      # The patch was generated against head.sha; refuse to apply it to a branch that has moved since.
      - name: Verify branch head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Download patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: renovate-patch
          path: ${{ runner.temp }}

      - name: Apply patch
        run: git apply --index "${RUNNER_TEMP}/renovate.patch"

      - name: Commit changes
        id: commit
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "Update files for renovate"
          commit_author: "renovate[bot] <29139614+renovate[bot]@users.noreply.github.com>"
