name: Release Prep

# Stage one of two: builds the release from an internal release branch, pushes
# the images to the staging registry, tests them, and emits a signed release
# manifest. Publishes nothing public -- release-publish.yml does that.
# Dispatch this from the internal release branch (internal/release-X.Y); the
# first step rejects any other ref.

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version, for example v2.8.0
        required: true
        type: string
      operator_version:
        description: Operator version, for example v0.3.0
        required: true
        type: string
      dry_run:
        description: >
          Build everything but push nothing to the staging registry. No images
          are pushed, so no digests exist and the manifest is skipped: a dry
          run checks that the pipeline runs, not that it produced a release.
        required: false
        type: boolean
        default: false

run-name: >-
  ${{ inputs.dry_run && '[DRY RUN] ' || '' }}Prep ${{ inputs.release_version }}
  from ${{ github.ref_name }} by @${{ github.actor }}

# Shared with release-publish.yml: prep and publish for the same release line
# must never overlap. cancel-in-progress stays false since a cancelled prep
# leaves the staging registry unrecorded.
concurrency:
  group: ${{ github.ref_name }}-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  vars:
    name: Checks and variables
    # The only job allowed a fallback, so it can start and say what is wrong:
    # with INTERNAL_RUNNER unset it fails at its first step, before checking
    # anything out, and every other job needs it, so none starts.
    runs-on: ${{ vars.INTERNAL_RUNNER || 'ubuntu-26.04' }}
    if: github.repository == vars.INTERNAL_REPOSITORY
    permissions:
      contents: read
      id-token: write # for get-from-vault to authenticate with Azure
    outputs:
      go_path: ${{ steps.vars.outputs.go_path }}
      min_k8s_version: ${{ steps.vars.outputs.min_k8s_version }}
      k8s_latest: ${{ steps.vars.outputs.k8s_latest }}
      sha: ${{ steps.source.outputs.sha }}
      tree_hash: ${{ steps.source.outputs.tree_hash }}
      # Strips the `v` prefix once here (v2.8.0 -> 2.8.0) so no later job has
      # to remember which form it needs.
      version: ${{ steps.version.outputs.version }}
    steps:
      # Every production artifact is built on the mirror's internal runner.
      # Without this, an unset variable would build a release on a
      # GitHub-hosted runner and say nothing.
      - name: Assert the internal runner is configured
        env:
          INTERNAL_RUNNER: ${{ vars.INTERNAL_RUNNER }}
        run: |
          [ -n "${INTERNAL_RUNNER}" ] && exit 0
          echo "::error title=INTERNAL_RUNNER is not set::Set the INTERNAL_RUNNER repository variable to the mirror's internal runner label. Release builds must not run on GitHub-hosted runners."
          exit 1

      # No branch input by design: the signing certificate names the
      # dispatched ref, and publish rejects anything not signed on internal/release-X.Y.
      - name: Assert this is an internal release branch
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "${REF_NAME}" | grep -Eq '^internal/release-[0-9]+\.[0-9]+$' && exit 0
          echo "::error title=Dispatch prep from the internal release branch::This run was dispatched from '${REF_NAME}'. Set 'Use workflow from' to the internal release branch (internal/release-X.Y) and re-run. The manifest is signed with the branch prep runs on, and publish refuses any other."
          exit 1

      - name: Checkout the internal release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Golang Environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            tests/go.sum

      - name: Strip the tag prefix from the version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          [ -n "${RELEASE_VERSION}" ] || { echo "error: release_version is empty" >&2; exit 1; }
          echo "version=${RELEASE_VERSION#v}" >> "$GITHUB_OUTPUT"

      # Pinned once here and passed to every later job, so a commit landing
      # mid-run cannot be built or tested in place of the one prep started from.
      - name: Pin the source commit and its tree
        id: source
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "tree_hash=$(git rev-parse "${sha}^{tree}")" >> "$GITHUB_OUTPUT"

      - name: Output Variables
        id: vars
        run: |
          K8S_KIND_VERSION=v1.37.0 # renovate: datasource=docker depName=kindest/node
          echo "go_path=$(go env GOPATH)" >> $GITHUB_OUTPUT
          echo "min_k8s_version=v1.32.11" >> $GITHUB_OUTPUT
          echo "k8s_latest=${K8S_KIND_VERSION}" >> $GITHUB_OUTPUT

      - name: Check if all the generated files are up to date
        run: make generate-all && git diff --exit-code

      # Fetched here only to fail early: every job that uses them fetches its
      # own, since a masked value cannot pass between jobs. The action fails
      # on a missing or empty entry, naming it, and never prints a value.
      - name: Assert the staging hosts are in the vault
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@2ac905a974d15594f0e03697b4f88916fbb3694d
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.AZ_VAULT_NAME }}
          secret-names: "staging-write-registry,staging-read-registry,staging-pkg-host"
          env-names: "STAGING_WRITE_REGISTRY,STAGING_READ_REGISTRY,STAGING_PKG_HOST"

  binary:
    name: Build Binary
    needs: [vars]
    runs-on: ${{ vars.INTERNAL_RUNNER }}
    if: github.repository == vars.INTERNAL_REPOSITORY
    permissions:
      contents: read
      id-token: write # for get-from-vault to authenticate with Azure
    outputs:
      json: ${{ steps.gateway_binaries.outputs.json }}
    steps:
      - name: Checkout the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.vars.outputs.sha }}
          fetch-depth: 0

      - name: Setup Golang Environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: go.sum

      - name: Download Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build binary
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2 # renovate: datasource=github-tags depName=goreleaser/goreleaser
          # --snapshot reports "skipping announce, publish, and validate" --
          # a stronger guarantee of no publish than reasoning about --skip flags.
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOPATH: ${{ needs.vars.outputs.go_path }}
          TELEMETRY_ENDPOINT: oss-dev.edge.df.f5.com:443
          TELEMETRY_ENDPOINT_INSECURE: "false"
          # snapshot.version_template overrides GORELEASER_CURRENT_TAG, so the
          # version must be passed explicitly here, without the `v`.
          NGF_VERSION: ${{ needs.vars.outputs.version }}

      - name: Assert the build is stamped with the expected version
        env:
          EXPECT_VERSION: ${{ needs.vars.outputs.version }}
          DIST_DIR: ${{ github.workspace }}/dist
        run: .github/scripts/assert-binary-version.sh

      - name: Collect release assets
        id: assets
        env:
          DIST_DIR: ${{ github.workspace }}/dist
        # Asserts the inventory rather than uploading whatever it finds:
        # 2 archives, 2 SPDX documents, 1 checksums file, 1 signature bundle.
        run: |
          set -euo pipefail
          echo "paths<<ASSET_LIST" >>"$GITHUB_OUTPUT"
          .github/scripts/collect-release-assets.sh >>"$GITHUB_OUTPUT"
          echo "ASSET_LIST" >>"$GITHUB_OUTPUT"

      # Shell bodies stay flat: yamllint's check-multi-line-strings reads an
      # indented `if` or `for` body as a YAML indentation error.
      - name: Extract gateway binaries info
        id: gateway_binaries
        env:
          DIST_DIR: ${{ github.workspace }}/dist
        run: |
          set -euo pipefail
          binaries=()
          for bin in $(find "${DIST_DIR}" -type f -name "gateway"); do
          dir=$(basename "$(dirname "${bin}")")
          if [[ "${dir}" =~ gateway_([a-zA-Z0-9]+)_([a-zA-Z0-9]+) ]]; then
          os="${BASH_REMATCH[1]}"
          arch="${BASH_REMATCH[2]}"
          digest=$(sha256sum "${bin}" | cut -d' ' -f1)
          binaries+=("{\"path\":\"${bin}\",\"os\":\"${os}\",\"arch\":\"${arch}\",\"digest\":\"${digest}\"}")
          fi
          done
          [ "${#binaries[@]}" -gt 0 ] || { echo "error: no gateway binaries found under ${DIST_DIR}" >&2; exit 1; }
          IFS=','
          echo "json=[${binaries[*]}]" >> "$GITHUB_OUTPUT"

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ github.run_id }}
          path: ${{ github.workspace }}/dist
          retention-days: 1

  assertion:
    name: Generate and Sign Assertion Documents
    needs: [vars, binary]
    runs-on: ${{ vars.INTERNAL_RUNNER }}
    if: github.repository == vars.INTERNAL_REPOSITORY
    permissions:
      contents: read
      id-token: write # for compliance-rules action to sign assertion doc
    strategy:
      fail-fast: false
      matrix:
        gateway: ${{ fromJson(needs.binary.outputs.json) }}
    steps:
      - name: Checkout the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.vars.outputs.sha }}

      - name: Get secrets from common vault
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@2ac905a974d15594f0e03697b4f88916fbb3694d
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.AZ_COMMON_VAULT_NAME }}
          secret-names: "artifactory-service-user-nginx,artifactory-service-user-nginx-token,artifactory-go-url"
          env-names: "ARTIFACTORY_USER,ARTIFACTORY_TOKEN,ARTIFACTORY_URL"

      - name: Configure GOPROXY
        run: echo "GOPROXY=https://${ARTIFACTORY_USER}:${ARTIFACTORY_TOKEN}@${ARTIFACTORY_URL}" >> "$GITHUB_ENV"

      - name: Setup Golang Environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ github.run_id }}
          path: ${{ github.workspace }}/dist

      - name: List Dependencies in Go Binary
        id: godeps
        env:
          GATEWAY_OS: ${{ matrix.gateway.os }}
          GATEWAY_ARCH: ${{ matrix.gateway.arch }}
        run: |
          set -euo pipefail
          out="goversionm_${GITHUB_RUN_ID}_${GITHUB_RUN_NUMBER}_${GATEWAY_OS}_${GATEWAY_ARCH}.txt"
          go version -m dist/gateway_"${GATEWAY_OS}"_"${GATEWAY_ARCH}"*/gateway > "${out}"
          echo "goversionm=${out}" >> "$GITHUB_OUTPUT"
          cat "${out}"

      # Named against the pinned commit, not github.sha, which may not match
      # the internal release branch prep actually built.
      - name: Generate Assertion Document
        id: assertiondoc
        uses: nginx/compliance-rules/.github/actions/assertion@c38f5c071ce50e37cbfb59e7c10eff5751d252d6 # v0.3.6
        with:
          artifact-name: ${{ github.event.repository.name }}_${{ needs.vars.outputs.sha }}_${{ github.run_number }}_${{ matrix.gateway.os }}_${{ matrix.gateway.arch }}
          artifact-digest: ${{ matrix.gateway.digest }}
          build-type: 'github'
          builder-id: 'github.com'
          builder-version: '0.1.0-xyz'
          invocation-id: ${{ github.run_id }}.${{ github.run_number }}.${{ strategy.job-index }}
          started-on: ${{ github.event.created_at }}
          finished-on: ${{ github.event.created_at }}
          artifactory-user: ${{ env.ARTIFACTORY_USER }}
          artifactory-api-token: ${{ env.ARTIFACTORY_TOKEN }}
          artifactory-url: https://${{ env.ARTIFACTORY_URL }}
          artifactory-repo: 'f5-nginx-go-local-approved-dependency'
          assertion-doc-file: assertion_${{ github.event.repository.name }}_${{ needs.vars.outputs.sha }}_${{ github.run_id }}_${{ github.run_number }}_${{ matrix.gateway.os }}_${{ matrix.gateway.arch }}.json
          build-content-path: ${{ steps.godeps.outputs.goversionm }}

      - name: Sign and Store Assertion Document
        uses: nginx/compliance-rules/.github/actions/sign@c38f5c071ce50e37cbfb59e7c10eff5751d252d6 # v0.3.6
        with:
          assertion-doc: ${{ steps.assertiondoc.outputs.assertion-document-path }}

  build-oss:
    name: Build OSS images
    needs: [vars, binary]
    if: github.repository == vars.INTERNAL_REPOSITORY
    strategy:
      fail-fast: false
      matrix:
        image: [ngf, nginx]
        build-os: ["", "ubi"]
    uses: ./.github/workflows/build.yml
    with:
      image: ${{ matrix.image }}
      platforms: "linux/arm64, linux/amd64"
      build-os: ${{ matrix.build-os }}
      tag: ${{ inputs.release_version }}
      source_ref: ${{ needs.vars.outputs.sha }}
      dry_run: ${{ inputs.dry_run }}
      runner: ${{ vars.INTERNAL_RUNNER }}
      # OSS images go to staging too, so publish promotes every image from
      # one place rather than testing a mix of staged and public builds.
      staging: true
    permissions:
      contents: read
      security-events: write
      packages: write
      id-token: write
    secrets: inherit

  build-plus:
    name: Build Plus images
    needs: [vars, binary]
    if: github.repository == vars.INTERNAL_REPOSITORY
    strategy:
      fail-fast: false
      matrix:
        build-os: ["", "ubi"]
    uses: ./.github/workflows/build.yml
    with:
      image: plus
      platforms: "linux/arm64, linux/amd64"
      build-os: ${{ matrix.build-os }}
      tag: ${{ inputs.release_version }}
      source_ref: ${{ needs.vars.outputs.sha }}
      dry_run: ${{ inputs.dry_run }}
      runner: ${{ vars.INTERNAL_RUNNER }}
      # Licensed packages come from the staging package host: a release ships
      # a specific patched NGINX Plus build, so it must resolve that package.
      staging: true
    permissions:
      contents: read
      security-events: write
      packages: write
      id-token: write
    secrets: inherit

  build-plus-nap-waf:
    name: Build Plus NAP WAF images
    needs: [vars, binary]
    if: github.repository == vars.INTERNAL_REPOSITORY
    strategy:
      fail-fast: false
      matrix:
        build-os: ["", "ubi"]
    uses: ./.github/workflows/build.yml
    with:
      image: plus-nap-waf
      platforms: "linux/amd64"
      build-os: ${{ matrix.build-os }}
      tag: ${{ inputs.release_version }}
      source_ref: ${{ needs.vars.outputs.sha }}
      dry_run: ${{ inputs.dry_run }}
      runner: ${{ vars.INTERNAL_RUNNER }}
      staging: true
    permissions:
      contents: read
      security-events: write
      packages: write
      id-token: write
    secrets: inherit

  build-operator:
    name: Build Operator images
    needs: [vars, binary]
    if: github.repository == vars.INTERNAL_REPOSITORY
    uses: ./.github/workflows/build.yml
    with:
      image: operator
      platforms: "linux/arm64, linux/amd64"
      # The operator carries its own version, not the NGF release version.
      tag: ${{ inputs.operator_version }}
      source_ref: ${{ needs.vars.outputs.sha }}
      dry_run: ${{ inputs.dry_run }}
      runner: ${{ vars.INTERNAL_RUNNER }}
      staging: true
    permissions:
      contents: read
      security-events: write
      packages: write
      id-token: write
    secrets: inherit

  # The tests below pull by tag, but the manifest records digests and publish
  # promotes those. This holds every tag the tests pull to the digest its build
  # recorded, so a tag moved since the build fails here instead of letting the
  # tests pass against something that is not what gets signed.
  staged-digests:
    name: Check the staged tags match the built digests
    needs: [vars, build-oss, build-plus, build-plus-nap-waf]
    runs-on: ${{ vars.INTERNAL_RUNNER }}
    if: github.repository == vars.INTERNAL_REPOSITORY && (!inputs.dry_run)
    permissions:
      contents: read
      id-token: write # for get-from-vault to authenticate with Azure
    steps:
      - name: Checkout the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.vars.outputs.sha }}

      - name: Download the digest records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*-${{ github.run_id }}
          path: digests
          merge-multiple: true

      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo

      # The read mirror takes the licence JWT as username, as the suites do.
      - name: Get the registry JWT and host from the vault
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@2ac905a974d15594f0e03697b4f88916fbb3694d
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.AZ_VAULT_NAME }}
          secret-names: "jwt-plus-waf-registry,staging-read-registry"
          env-names: "JWT_PLUS_WAF_REGISTRY,STAGING_READ_REGISTRY"

      - name: Login to the staging read registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ github.repository == vars.INTERNAL_REPOSITORY }}
        with:
          registry: ${{ env.STAGING_READ_REGISTRY }}
          username: ${{ env.JWT_PLUS_WAF_REGISTRY }}
          password: none

      # Reads the same registry and tag the suites below are given. The
      # operator is left out: no suite pulls it.
      - name: Assert the staged tags resolve to the recorded digests
        env:
          DIGEST_DIR: digests
          REGISTRY: ${{ env.STAGING_READ_REGISTRY }}
          TAG: ${{ needs.vars.outputs.version }}
          IMAGES: ngf nginx plus plus-nap-waf
        run: .github/scripts/assert-staged-digests.sh

  # The tests below pull the staged images by tag from the staging read
  # mirror, rather than rebuilding, so they exercise the exact artifact
  # publish will promote. staged-digests has already tied each tag to the
  # digest the manifest will record.
  functional-tests:
    name: Functional tests
    needs: [vars, build-oss, build-plus, build-plus-nap-waf, staged-digests]
    if: github.repository == vars.INTERNAL_REPOSITORY && (!inputs.dry_run)
    strategy:
      fail-fast: false
      matrix:
        image: [nginx, plus, plus-waf]
        build-os: ["", "ubi"]
        k8s-version: ["${{ needs.vars.outputs.min_k8s_version }}", "${{ needs.vars.outputs.k8s_latest }}"]
    uses: ./.github/workflows/functional.yml
    with:
      runner: ${{ vars.INTERNAL_RUNNER }}
      image: ${{ matrix.image }}
      k8s-version: ${{ matrix.k8s-version }}
      build-os: ${{ matrix.build-os }}
      image-source: registry
      image-tag: ${{ needs.vars.outputs.version }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  conformance-tests:
    name: Conformance tests
    needs: [vars, build-oss, build-plus, staged-digests]
    if: github.repository == vars.INTERNAL_REPOSITORY && (!inputs.dry_run)
    strategy:
      fail-fast: false
      matrix:
        image: [nginx, plus]
        build-os: ["", "ubi"]
        k8s-version: ["${{ needs.vars.outputs.min_k8s_version }}", "${{ needs.vars.outputs.k8s_latest }}"]
        enable-experimental: [true, false]
    uses: ./.github/workflows/conformance.yml
    with:
      runner: ${{ vars.INTERNAL_RUNNER }}
      image: ${{ matrix.image }}
      k8s-version: ${{ matrix.k8s-version }}
      enable-experimental: ${{ matrix.enable-experimental }}
      build-os: ${{ matrix.build-os }}
      # production-release stays false: it controls publishing, and prep
      # publishes nothing.
      production-release: false
      release_version: ${{ inputs.release_version }}
      enable-inference-extension: true
      keep-profile: ${{ matrix.image == 'nginx' && matrix.build-os == '' && matrix.k8s-version == needs.vars.outputs.k8s_latest && matrix.enable-experimental }}
      # The kept profile is published with the release, so it records the
      # release version rather than the internal branch prep runs on.
      ngf-version: ${{ inputs.release_version }}
      image-source: registry
      image-tag: ${{ needs.vars.outputs.version }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  helm-tests:
    name: Helm Tests
    needs: [vars, build-oss, build-plus, staged-digests]
    if: github.repository == vars.INTERNAL_REPOSITORY && (!inputs.dry_run)
    strategy:
      fail-fast: false
      matrix:
        image: [nginx, plus]
        k8s-version: ["${{ needs.vars.outputs.min_k8s_version }}", "${{ needs.vars.outputs.k8s_latest }}"]
    uses: ./.github/workflows/helm.yml
    with:
      runner: ${{ vars.INTERNAL_RUNNER }}
      image: ${{ matrix.image }}
      k8s-version: ${{ matrix.k8s-version }}
      tag: ${{ inputs.release_version }}
      image-source: registry
      image-tag: ${{ needs.vars.outputs.version }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  manifest:
    name: Emit the release manifest
    needs: [vars, build-oss, build-plus, build-plus-nap-waf, build-operator, staged-digests, functional-tests, conformance-tests, helm-tests]
    runs-on: ${{ vars.INTERNAL_RUNNER }}
    # The manifest is publish's evidence that this release was built and
    # tested, so every test must have passed and a dry run emits none.
    if: github.repository == vars.INTERNAL_REPOSITORY && (!inputs.dry_run)
    permissions:
      contents: read
      id-token: write # for cosign keyless signing of the manifest
    steps:
      - name: Checkout the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.vars.outputs.sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download the digest records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*-${{ github.run_id }}
          path: digests
          merge-multiple: true

      - name: Download the binaries and their side-cars
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ github.run_id }}
          path: dist

      # Every release carries the conformance profiles of the run that tested
      # it. They are staged and signed with the binaries, so the profile on the
      # release is the one for the commit and images that ship. A missing
      # artifact fails here, before anything is staged.
      - name: Download the conformance profile
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conformance-profile
          path: profiles

      - name: Download the inference conformance profile
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conformance-profile-inference
          path: profiles

      # Blob storage is the store both repositories can reach; an Actions
      # artifact cannot cross from the mirror to the public repository.
      - name: Get the asset store from the vault
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@2ac905a974d15594f0e03697b4f88916fbb3694d
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.AZ_VAULT_NAME }}
          secret-names: "azure-storage-account,azure-storage-bucket"
          env-names: "AZURE_STORAGE_ACCOUNT,AZURE_STORAGE_CONTAINER"

      # The same identity that reads the vault, which therefore needs write
      # access to the asset container. No subscription: the blob commands
      # address the storage account by name and never go through ARM.
      - name: Log in to Azure for the upload
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Stage the release assets
        id: assets
        env:
          DIST_DIR: dist
          EXTRA_ASSETS: |
            profiles/conformance-profile.yaml
            profiles/conformance-profile-inference.yaml
          RELEASE_VERSION: ${{ inputs.release_version }}
          STORAGE_ACCOUNT: ${{ env.AZURE_STORAGE_ACCOUNT }}
          STORAGE_CONTAINER: ${{ env.AZURE_STORAGE_CONTAINER }}
        run: |
          set -euo pipefail
          .github/scripts/stage-release-assets.sh > asset-refs.json
          echo "staged $(jq length asset-refs.json) assets"

      - name: Emit the release manifest
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          OPERATOR_VERSION: ${{ inputs.operator_version }}
          INTERNAL_BRANCH: ${{ github.ref_name }}
          INTERNAL_SHA: ${{ needs.vars.outputs.sha }}
          TREE_HASH: ${{ needs.vars.outputs.tree_hash }}
          DIGEST_DIR: digests
        run: ASSET_REFS="$(cat asset-refs.json)" .github/scripts/emit-release-manifest.sh | tee release-manifest.json

      # Keyless: the certificate names this repo, workflow, and branch, which
      # publish checks before trusting the manifest.
      - name: Sign the release manifest
        run: cosign sign-blob --yes --use-signing-config=false --bundle release-manifest.sigstore.json release-manifest.json

      - name: Upload the release manifest and its signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest-${{ inputs.release_version }}
          path: |
            release-manifest.json
            release-manifest.sigstore.json
          if-no-files-found: error
