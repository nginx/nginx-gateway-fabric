name: Update Docker Images

on:
  schedule:
    - cron: "0 2 * * *" # run every day at 02:00 UTC
  workflow_dispatch:
    inputs:
      force-update:
        description: 'Force update of images'
        required: false
        type: boolean

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.ref_name }}-update-images
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  variables:
    name: Get versions of base images
    runs-on: ubuntu-26.04
    outputs:
      ngf_tag: ${{ steps.ngf.outputs.tag }}
      nginx_version: ${{ steps.nginx.outputs.nginx_version }}
    if: github.repository == 'nginx/nginx-gateway-fabric'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set NGF version
        id: ngf
        run: |
          tag="$(git tag --sort=-version:refname | head -n1)"
          echo "tag=${tag//v}" >> $GITHUB_OUTPUT

      - name: Checkout Repository at ${{ steps.ngf.outputs.tag }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ steps.ngf.outputs.tag }}

      - name: Set NGINX version
        id: nginx
        run: |
          version=$(grep -m1 "FROM.*nginx:.*alpine" < build/Dockerfile.nginx | awk -F" " '{print $2}')
          echo nginx_version=${version} >> $GITHUB_OUTPUT

  check:
    name: Check if updates are needed
    runs-on: ubuntu-26.04
    needs: variables
    if: github.repository == 'nginx/nginx-gateway-fabric'
    outputs:
      needs-updating: ${{ steps.update.outputs.needs-updating }}
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if update available for nginx image
        id: update
        uses: lucacome/docker-image-update-checker@958e0b396cd5227e7da180826286ef48c20296f9 # v3.1.2
        with:
          base-image: ${{ needs.variables.outputs.nginx_version }}
          image: ghcr.io/nginx/nginx-gateway-fabric/nginx:${{ needs.variables.outputs.ngf_tag }}

  rust-modules:
    name: Build Rust NGINX modules
    needs: [variables, check]
    if: ${{ github.repository == 'nginx/nginx-gateway-fabric' && (needs.check.outputs.needs-updating == 'true' || inputs.force-update == true) }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout Repository at latest release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ needs.variables.outputs.ngf_tag }}

      - name: Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Setup QEMU
        if: ${{ matrix.arch == 'arm64' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Build Rust modules (musl/${{ matrix.arch }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: build/Dockerfile.rustmodules
          context: "."
          platforms: linux/${{ matrix.arch }}
          build-args: LIBC=musl
          outputs: type=local,dest=${{ github.workspace }}/rust-modules
          cache-from: type=gha,scope=rust-modules-musl-${{ matrix.arch }}-oss
          cache-to: type=gha,scope=rust-modules-musl-${{ matrix.arch }}-oss,mode=max

      - name: Upload Rust modules
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-modules-alpine-${{ matrix.arch }}-oss-${{ github.run_id }}
          path: ${{ github.workspace }}/rust-modules
          retention-days: 1

  build:
    name: Build Image
    needs: [variables, check, rust-modules]
    if: ${{ github.repository == 'nginx/nginx-gateway-fabric' && (needs.check.outputs.needs-updating == 'true' || inputs.force-update == true) }}
    uses: ./.github/workflows/build.yml
    with:
      image: nginx
      platforms: "linux/arm64,linux/amd64"
      tag: ${{ needs.variables.outputs.ngf_tag }}
      rust_modules_artifact: rust-modules-alpine-*-oss-${{ github.run_id }}
    permissions:
      contents: read # for docker/build-push-action to read repo content
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      packages: write # for docker/build-push-action to push to GHCR
      id-token: write # for docker/login to login to NGINX registry
