name: GatewayLink Integration Testing

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version of NGF under test
        required: true
        default: edge
      image_tag:
        description: Tag of the NGF and NGINX Docker images
        required: true
        default: edge
      type:
        description: Type of NGINX image to test
        required: true
        default: both
        type: choice
        options: [oss, plus, both]
  schedule:
    - cron: "0 16 5,20 * *" # Run on the 5th and 20th of every month at 16:00 UTC
defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  vars:
    name: Set up vars
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ github.event.inputs.version || 'edge' }}
      image_tag: ${{ github.event.inputs.image_tag || 'edge' }}
      types: ${{ steps.var.outputs.types }}
    steps:
      - name: Set vars
        id: var
        run: |
          if ${{ github.event.inputs.type == 'both' || github.event_name == 'schedule' }}; then
          echo 'types=["oss","plus"]' >> $GITHUB_OUTPUT
          else
          echo 'types=["${{ github.event.inputs.type }}"]' >> $GITHUB_OUTPUT
          fi

  setup-and-run-tests:
    name: Setup and Run GatewayLink Test (${{ matrix.type }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # needed for authenticating to GCP
    needs: vars
    strategy:
      fail-fast: false
      matrix:
        # One leg per NGINX data plane. Each leg runs both pool modes (nodeport then cluster) in a
        # single suite invocation, so pool mode is not a matrix dimension.
        type: ${{ fromJson(needs.vars.outputs.types) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get secrets
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@refs/heads/main
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.AZ_VAULT_NAME }}
          secret-names: "bigip-admin-password,gcp-workload-identity,gcp-service-account,gcp-project-id,gcp-nodes-service-account${{ matrix.type == 'plus' && ',jwt-plus-reporting-endpoint,jwt-plus-exception-reporting' || '' }}"
          env-names: "BIGIP_ADMIN_PASSWORD,GCP_WORKLOAD_IDENTITY,GCP_SERVICE_ACCOUNT,GCP_PROJECT_ID,GKE_NODES_SERVICE_ACCOUNT${{ matrix.type == 'plus' && ',PLUS_USAGE_ENDPOINT,PLUS_LICENSE' || '' }}"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Login to GAR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          install_components: kubectl

      - name: Setup dotenv file
        working-directory: ./tests/scripts
        env:
          NGF_BRANCH: ${{ github.ref_name }}
        run: |
          RUN=${{ github.run_id }}-${{ matrix.type }}
          echo "RESOURCE_NAME=gatewaylink-tests-${RUN}" >> vars.env
          echo "TAG=${{ needs.vars.outputs.image_tag }}" >> vars.env
          echo "PREFIX=ghcr.io/nginx/nginx-gateway-fabric" >> vars.env
          echo "NGINX_PREFIX=ghcr.io/nginx/nginx-gateway-fabric/nginx" >> vars.env
          echo "NGINX_PLUS_PREFIX=us-docker.pkg.dev/${GCP_PROJECT_ID}/nginx-gateway-fabric/nginx-plus" >> vars.env
          echo "GKE_CLUSTER_NAME=gatewaylink-tests-${RUN}" >> vars.env
          echo "GKE_CLUSTER_ZONE=us-west1-b" >> vars.env
          echo "GKE_CLUSTER_REGION=us-west1" >> vars.env
          echo "GKE_PROJECT=${GCP_PROJECT_ID}" >> vars.env
          echo "GKE_SVC_ACCOUNT=${GCP_SERVICE_ACCOUNT}" >> vars.env
          echo "GKE_NODES_SERVICE_ACCOUNT=${GKE_NODES_SERVICE_ACCOUNT}" >> vars.env
          echo "NETWORK_TAGS=gatewaylink-tests-${RUN}" >> vars.env
          echo "NGF_BRANCH=${NGF_BRANCH}" >> vars.env
          echo "SOURCE_IP_RANGE=$(curl -sS -4 icanhazip.com)/32" >> vars.env
          echo "ADD_VM_IP_AUTH_NETWORKS=true" >> vars.env
          echo "PLUS_ENABLED=${{ matrix.type == 'plus' }}" >> vars.env
          echo "NGF_VERSION=${{ needs.vars.outputs.version }}" >> vars.env
          # BIG-IP + CIS
          echo "BIGIP_RESOURCE_NAME=gatewaylink-bigip-${RUN}" >> vars.env
          # PAYG image from F5's public image project, so it is not a secret. It self-licenses on boot.
          echo "BIGIP_IMAGE=projects/f5-7626-networks-public/global/images/f5-bigip-17-1-0-3-0-77-4-payg-good-1gbps-231026113952" >> vars.env
          echo "BIGIP_NETWORK_TAGS=gatewaylink-bigip-${RUN}" >> vars.env
          # BIGIP_VIP is NOT set here. The BIG-IP is created fresh, so create-bigip-vm.sh reads the
          # assigned internal VIP and appends it to vars.env. The external management address stays a
          # local variable in that script and is deliberately not persisted.
          echo "BIGIP_MGMT_PORT=8443" >> vars.env
          echo "BIGIP_PARTITION=gatewaylink" >> vars.env
          echo "BIGIP_USERNAME=admin" >> vars.env
          # From a repo secret so it is masked in logs and not committed in plaintext. The management
          # port is also firewalled to the runner IP and the node and pod ranges only, and the BIG-IP
          # is torn down each run.
          echo "BIGIP_PASSWORD=${BIGIP_ADMIN_PASSWORD}" >> vars.env
          echo "PLUS_USAGE_ENDPOINT=${PLUS_USAGE_ENDPOINT}" >> vars.env

      - name: Setup license file for plus
        if: matrix.type == 'plus'
        run: echo "${PLUS_LICENSE}" > license.jwt

      - name: Create GKE cluster
        working-directory: ./tests
        run: make create-gke-cluster CI=true

      - name: Create GKE router
        working-directory: ./tests
        run: make create-gke-router || true

      - name: Create and setup VM
        working-directory: ./tests
        run: make create-and-setup-vm

      - name: Create BIG-IP VM
        working-directory: ./tests
        run: make create-bigip-vm

      - name: Run GatewayLink test
        working-directory: ./tests
        run: make gatewaylink-test CI=true

      - name: Cleanup
        working-directory: ./tests
        if: always()
        run: |
          bash scripts/cleanup-bigip-vm.sh || true
          bash scripts/cleanup-vm.sh true
          bash scripts/cleanup-router.sh true
          make delete-gke-cluster
          rm -rf scripts/vars.env
