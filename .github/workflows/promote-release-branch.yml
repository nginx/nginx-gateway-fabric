name: Promote Release Branch

# The release-day transfer: fast-forwards the public release branch from the
# internal one, then dispatches publish. Runs in the mirror -- the only place
# in this design that writes to the public repository -- and only ever
# fast-forwards; a non-fast-forward is refused rather than forced.

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: >
          The release, for example v2.8.0. Prep must have run for it; the
          release branch, release-X.Y, follows from it.
        required: true
        type: string
      mode:
        description: >
          check changes nothing: it checks the manifest and that the public
          branch can be fast-forwarded. promote-and-verify pushes the public
          release branch and runs publish in verify mode, which publishes
          nothing else. release pushes the branch and publishes.
        required: true
        type: choice
        options:
          - check
          - promote-and-verify
          - release
        default: check
      prep_run_id:
        description: >
          Use this prep run instead of the newest one for the version. Leave
          empty unless a specific prep run is wanted.
        required: false
        type: string
        default: ''
      accept_failed_tests:
        description: >
          Promote even though functional legs of the prep run failed. Give the
          reason, for example the flaky spec and its issue; it is recorded in
          this run's summary. Leave empty to require every leg to pass.
        required: false
        type: string
        default: ''

run-name: >-
  ${{ inputs.mode == 'check' && '[CHECK] ' || (inputs.mode == 'promote-and-verify' && '[VERIFY] ' || '') }}Promote ${{ inputs.release_version }}
  by @${{ github.actor }}

defaults:
  run:
    shell: bash

permissions:
  contents: read
  actions: read # to find and download the prep run's manifest artifact

jobs:
  # On a GitHub-hosted runner so it can always start and say what is wrong.
  runner:
    name: Check the internal runner
    runs-on: ubuntu-26.04
    if: github.repository == vars.INTERNAL_REPOSITORY
    steps:
      - name: Assert the internal runner is configured
        env:
          INTERNAL_RUNNER: ${{ vars.INTERNAL_RUNNER }}
        run: |
          [ -n "${INTERNAL_RUNNER}" ] && exit 0
          echo "::error title=INTERNAL_RUNNER is not set::Set the INTERNAL_RUNNER repository variable to the mirror's internal runner label. A release is not promoted from a GitHub-hosted runner."
          exit 1

  promote:
    name: Promote the release branch
    needs: [runner]
    # The internal runner, like prep and publish: this is the step that moves
    # the release onto the public branch.
    runs-on: ${{ vars.INTERNAL_RUNNER }}
    if: github.repository == vars.INTERNAL_REPOSITORY
    permissions:
      contents: read
      actions: read # to find the prep run, download its manifest and read its job results
      id-token: write # for get-from-vault to authenticate with Azure
    steps:
      # The bot token, which already writes to the public repository for the
      # operator bundle. Promote also needs it to push release-X.Y past branch
      # protection, to dispatch workflows, and to carry the `workflow` scope:
      # GitHub refuses a push that changes .github/workflows/ from a token
      # without it, and a release branch can carry such a change.
      - name: Get the bot token from the common vault
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@2ac905a974d15594f0e03697b4f88916fbb3694d
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.AZ_COMMON_VAULT_NAME }}
          secret-names: "nginx-bot-pat"
          env-names: "PUBLIC_REPO_TOKEN"

      # persist-credentials: false, because checkout otherwise installs this
      # repository's token as an http.extraheader for github.com, and that
      # header wins over the PUBLIC_REPO_TOKEN in the push URL: the push to the
      # public repository would go out as the mirror's token and be refused.
      # Nothing later needs it: the mirror's branches come from this checkout,
      # and the public repository is fetched anonymously.
      - name: Checkout the mirror
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Promote and dispatch
        env:
          # PUBLIC_REPO_TOKEN is in the environment from the vault step; gh
          # takes it as GH_TOKEN. The script checks PUBLIC_REPO_TOKEN itself,
          # so an unset one fails loudly rather than pushing anonymously.
          GH_TOKEN: ${{ env.PUBLIC_REPO_TOKEN }}
          # This repo's own token: gh otherwise uses GH_TOKEN, the public one.
          MIRROR_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          PREP_RUN_ID: ${{ inputs.prep_run_id }}
          ACCEPT_FAILED_TESTS: ${{ inputs.accept_failed_tests }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_VERSION}" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]] || { echo "error: release_version must look like vX.Y.Z, got '${RELEASE_VERSION}'" >&2; exit 2; }
          args=(--release-branch "release-${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" --release-version "${RELEASE_VERSION}")
          [ -n "${PREP_RUN_ID}" ] && args+=(--prep-run-id "${PREP_RUN_ID}")
          [ -n "${ACCEPT_FAILED_TESTS}" ] && args+=(--accept-failed-tests "${ACCEPT_FAILED_TESTS}")
          case "${MODE}" in
          check) args+=(--dry-run) ;;
          promote-and-verify) args+=(--publish-mode verify) ;;
          release) args+=(--publish-mode publish) ;;
          *) echo "error: unknown mode '${MODE}'" >&2; exit 2 ;;
          esac
          .github/scripts/promote-release-branch.sh "${args[@]}"
