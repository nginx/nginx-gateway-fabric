name: Build

on:
  workflow_call:
    inputs:
      platforms:
        required: true
        type: string
      build-os:
        required: false
        type: string
        default: ''
      image:
        required: true
        type: string
      tag:
        required: false
        type: string
        default: ''
      dry_run:
        required: false
        type: boolean
        default: false
      runner:
        required: false
        type: string
        default: 'ubuntu-26.04'
      oss_registry:
        description: |
          Registry and namespace for the OSS images (ngf, nginx, operator).
          Empty means ghcr.io/<repository owner>, which is where they are
          published from this repository.
        required: false
        type: string
        default: ''
      plus_registry:
        description: |
          Registry for the NGINX Plus images (plus, plus-nap-waf). Empty means
          docker-mgmt.nginx.com.
        required: false
        type: string
        default: ''
      source_ref:
        description: |
          Commit or branch to build from. Empty keeps the tag-driven
          behaviour the public release path relies on: check out
          refs/tags/<tag> and let metadata-action read git for the version.

          Release prep sets it, because prep builds from an internal branch
          before any tag exists -- the tag is created by publish, at the very
          end, once every artifact has published.
        required: false
        type: string
        default: ''
      image_prefix:
        description: Repository path prefix under the registry.
        required: false
        type: string
        default: 'nginx-gateway-fabric'
      staging:
        description: |
          Build for release prep: push to the staging registry and install
          NGINX packages from the staging package host. Both hosts are read
          from the vault in this job rather than taken as inputs, so they are
          masked in the log, and the package host reaches the image build as a
          secret, so it is recorded in neither the image nor its provenance.
          oss_registry and plus_registry are ignored when this is set.
        required: false
        type: boolean
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build:
    if: ${{ ! (github.event.pull_request.head.repo.fork && (inputs.image == 'plus' || inputs.image == 'plus-nap-waf') && inputs.build-os == 'ubi') }}
    permissions:
      contents: read # for docker/build-push-action to read repo content
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      packages: write # for docker/build-push-action to push to GHCR
      id-token: write # for docker/login to login to NGINX registry
    runs-on: ${{ inputs.runner }}
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || ((inputs.tag != '' && !inputs.dry_run && inputs.image != 'operator') && format('refs/tags/{0}', inputs.tag) || github.ref) }}

      - name: Get secrets
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@2ac905a974d15594f0e03697b4f88916fbb3694d
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.AZ_VAULT_NAME }}
          secret-names: "gcp-workload-identity,gcp-service-account,gcp-project-id"

      - name: Get secrets from common vault
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@2ac905a974d15594f0e03697b4f88916fbb3694d
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.AZ_COMMON_VAULT_NAME }}
          secret-names: "docker-username,docker-password${{ (inputs.image == 'plus' || inputs.image == 'plus-nap-waf') && ',nginx-pkg-certificate,nginx-pkg-key' || '' }}"
          env-names: "DOCKER_USERNAME,DOCKER_PASSWORD${{ (inputs.image == 'plus' || inputs.image == 'plus-nap-waf') && ',NGINX_CRT,NGINX_KEY' || '' }}"

      # Release prep's hosts. Held in the vault so that no log names them,
      # this one or the public repository's: the action masks what it fetches.
      - name: Get the staging hosts
        if: ${{ inputs.staging }}
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@2ac905a974d15594f0e03697b4f88916fbb3694d
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.AZ_VAULT_NAME }}
          secret-names: "staging-write-registry,staging-pkg-host"
          env-names: "STAGING_WRITE_REGISTRY,STAGING_PKG_HOST"

      # Not tee'd to the log: for a staging build the target names the staging
      # registry, and a masked value in an output is dropped by the runner, so
      # the steps below read the target from the environment instead.
      - name: Resolve the image target
        id: target
        env:
          IMAGE: ${{ inputs.image }}
          OWNER: ${{ github.repository_owner }}
          OSS_REGISTRY: ${{ inputs.staging && env.STAGING_WRITE_REGISTRY || inputs.oss_registry }}
          PLUS_REGISTRY: ${{ inputs.staging && env.STAGING_WRITE_REGISTRY || inputs.plus_registry }}
          IMAGE_PREFIX: ${{ inputs.image_prefix }}
        run: |
          set -euo pipefail
          out="$(.github/scripts/resolve-image-target.sh)"
          target="$(printf '%s\n' "${out}" | sed -n 's/^target=//p')"
          host="$(printf '%s\n' "${out}" | sed -n 's/^host=//p')"
          {
          echo "IMAGE_TARGET=${target}"
          echo "IMAGE_HOST=${host}"
          } >> "$GITHUB_ENV"
          # Only what a login needs to decide on; never the staging host itself.
          # The staging package host goes to the image build as a secret file
          # of NAME=host lines, which the Plus Dockerfiles source. Everything
          # but the agent comes from it: the agent is not staged.
          if [ -n "${STAGING_PKG_HOST:-}" ]; then
          {
          echo 'NGINX_PKG_HOSTS<<EOF_PKG_HOSTS'
          echo "NGINX_PLUS_PKG_HOST=${STAGING_PKG_HOST}"
          echo "NAP_WAF_PKG_HOST=${STAGING_PKG_HOST}"
          echo 'EOF_PKG_HOSTS'
          } >> "$GITHUB_ENV"
          fi
          case "${host}" in
          ghcr.io) echo "registry=ghcr" >> "$GITHUB_OUTPUT" ;;
          *nginx.com) echo "registry=nginx" >> "$GITHUB_OUTPUT" ;;
          *) echo "registry=other" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ github.run_id }}
          path: ${{ github.workspace }}/dist

      - name: Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      # On an internal runner, whichever repository's label it carries: the
      # public repository's and the mirror's internal runners have different
      # labels, and both need the credential to avoid anonymous pull limits.
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
        if: ${{ inputs.runner != 'ubuntu-26.04' }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ github.repository == 'nginx/nginx-gateway-fabric' && github.event_name != 'pull_request' && steps.target.outputs.registry == 'ghcr' }}
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Not gated by repository: minting an OIDC token reaches no registry
      # by itself. The login steps below decide which registry it is spent on.
      - name: Get Id Token
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: idtoken
        with:
          script: |
            let id_token = await core.getIDToken()
            core.setOutput('id_token', id_token)
        if: ${{ github.event_name != 'pull_request' && steps.target.outputs.registry == 'nginx' }}

      # The same login twice, split only by which repository it applies to, so
      # each gate stays the single comparison used everywhere else. A
      # parenthesised `(public || mirror) &&` would also pass the step checker.
      - name: Login to NGINX Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.IMAGE_HOST }}
          username: ${{ steps.idtoken.outputs.id_token }}
          password: ${{ github.actor }}
        if: ${{ github.repository == 'nginx/nginx-gateway-fabric' && github.event_name != 'pull_request' && steps.target.outputs.registry == 'nginx' }}

      - name: Login to the staging NGINX Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.IMAGE_HOST }}
          username: ${{ steps.idtoken.outputs.id_token }}
          password: ${{ github.actor }}
        if: ${{ github.repository == vars.INTERNAL_REPOSITORY && github.event_name != 'pull_request' && steps.target.outputs.registry == 'nginx' }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
        if: ${{ github.repository == 'nginx/nginx-gateway-fabric' && github.event_name != 'pull_request' && (inputs.image == 'plus' || inputs.image == 'plus-nap-waf') }}

      - name: Login to GAR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
        if: ${{ github.repository == 'nginx/nginx-gateway-fabric' && github.event_name != 'pull_request' && (inputs.image == 'plus' || inputs.image == 'plus-nap-waf') }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Prep has no tag to read, so a source_ref build uses `workflow`
          # instead of `git`; the semver rule below carries its own `value=`.
          context: ${{ inputs.source_ref == '' && inputs.tag != '' && 'git' || 'workflow' }}
          # Gated on github.repository, not github.repository_owner: the
          # private mirror reports the same owner and would otherwise publish.
          images: |
            name=${{ env.IMAGE_TARGET }},enable=${{ github.repository == 'nginx/nginx-gateway-fabric' && github.event_name != 'pull_request' }}
            name=${{ env.IMAGE_TARGET }},enable=${{ github.repository == vars.INTERNAL_REPOSITORY && github.event_name != 'pull_request' }}
            name=us-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/nginx-gateway-fabric/nginx-plus,enable=${{ github.repository == 'nginx/nginx-gateway-fabric' && inputs.image == 'plus' && github.event_name != 'pull_request' }}
            name=us-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/nginx-gateway-fabric/nginx-plus-f5waf,enable=${{ github.repository == 'nginx/nginx-gateway-fabric' && inputs.image == 'plus-nap-waf' && github.event_name != 'pull_request' }}
            name=localhost:5000/nginx-gateway-fabric/${{ inputs.image }}
          flavor: |
            latest=${{ (inputs.source_ref != '' || inputs.build-os != '') && 'false' || (inputs.tag != '' && 'true') || 'auto' }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }},suffix=${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
            type=edge,suffix=${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
            type=schedule,suffix=${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
            type=ref,event=pr,suffix=${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
          labels: |
            org.opencontainers.image.documentation=https://docs.nginx.com/nginx-gateway-fabric
            org.opencontainers.image.vendor=NGINX Inc <kubernetes@nginx.com>
          annotations: |
            org.opencontainers.image.documentation=https://docs.nginx.com/nginx-gateway-fabric
            org.opencontainers.image.vendor=NGINX Inc <kubernetes@nginx.com>
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/nginx/nginx-gateway-fabric/main/README.md
            io.artifacthub.package.logo-url=https://docs.nginx.com/nginx-gateway-fabric/images/icons/NGINX-product-icon.svg
            io.artifacthub.package.maintainers=[{"name":"NGINX Inc","email":"kubernetes@nginx.com"}]
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.keywords=kubernetes,gateway,nginx
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Build Docker Image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ${{ inputs.image == 'operator' && 'operators/Dockerfile' || (inputs.build-os != '' && format('build/{0}/Dockerfile{1}', inputs.build-os, inputs.image == 'nginx' && '.nginx' || (inputs.image == 'plus' || inputs.image == 'plus-nap-waf') && '.nginxplus' || '') || format('build/Dockerfile{0}', inputs.image == 'nginx' && '.nginx' || (inputs.image == 'plus' || inputs.image == 'plus-nap-waf') && '.nginxplus' || '')) }}
          context: "."
          target: ${{ inputs.image == 'ngf' && 'goreleaser' || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          push: ${{ !inputs.dry_run }}
          platforms: ${{ inputs.platforms }}
          cache-from: type=gha,scope=${{ inputs.image }}${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
          cache-to: type=gha,scope=${{ inputs.image }}${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }},mode=max
          pull: true
          no-cache: ${{ github.event_name != 'pull_request' }}
          sbom: true
          # Not mode=max: that embeds the full GitHub event payload, including
          # branch names and commit messages, in every published image.
          provenance: mode=min
          build-args: |
            NJS_DIR=internal/controller/nginx/modules/src
            NGINX_CONF_DIR=internal/controller/nginx/conf
            BUILD_AGENT=gha
            INCLUDE_NAP_WAF=${{ inputs.image == 'plus-nap-waf' && 'true' || 'false' }}
          secret-envs: |
            ${{ (inputs.image == 'plus' || inputs.image == 'plus-nap-waf') && 'nginx-repo.crt=NGINX_CRT' || '' }}
            ${{ (inputs.image == 'plus' || inputs.image == 'plus-nap-waf') && 'nginx-repo.key=NGINX_KEY' || '' }}
            ${{ inputs.staging && 'nginx-pkg-hosts=NGINX_PKG_HOSTS' || '' }}

      # Captured here, as a file rather than a job output, since a matrix leg
      # cannot return one output and every leg would overwrite the others'.
      - name: Record the pushed digest
        if: ${{ !inputs.dry_run && github.event_name != 'pull_request' }}
        env:
          IMAGE: ${{ inputs.image }}
          BUILD_OS: ${{ inputs.build-os }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          [ -n "${DIGEST}" ] || { echo "error: the build produced no digest" >&2; exit 1; }
          mkdir -p digests
          name="${IMAGE}${BUILD_OS:+-${BUILD_OS}}"
          # No repository in the record: the manifest is published with the
          # release, and a staging build's repository names the staging host.
          # Publish derives both ends from the image name and its own config.
          jq -n --arg image "${IMAGE}" --arg os "${BUILD_OS}" --arg digest "${DIGEST}" --arg platforms "${PLATFORMS}" '{image: $image, "base-os": $os, digest: $digest, platforms: $platforms}' | tee "digests/${name}.json"

      - name: Upload the digest record
        if: ${{ !inputs.dry_run && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ inputs.image }}${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}-${{ github.run_id }}
          path: digests/
          retention-days: 1
          if-no-files-found: error

      - name: Inspect SBOM and output manifest
        if: ${{ !inputs.dry_run }}
        run: |
          # For single-platform builds, SBOM is not indexed by platform
          # For multi-platform builds, we need to index by platform
          if [[ "${{ inputs.platforms }}" == *","* ]] || [[ "${{ inputs.platforms }}" == *" "* ]]; then
          # Multi-platform build - index by platform
          docker buildx imagetools inspect localhost:5000/nginx-gateway-fabric/${{ inputs.image }}:${{ steps.meta.outputs.version }} --format '{{ json (index .SBOM "linux/amd64").SPDX }}' > sbom-${{ inputs.image }}.json
          else
          # Single-platform build - SBOM is at top level
          docker buildx imagetools inspect localhost:5000/nginx-gateway-fabric/${{ inputs.image }}:${{ steps.meta.outputs.version }} --format '{{ json .SBOM.SPDX }}' > sbom-${{ inputs.image }}.json
          fi
          docker buildx imagetools inspect localhost:5000/nginx-gateway-fabric/${{ inputs.image }}:${{ steps.meta.outputs.version }} --raw

      - name: Scan SBOM
        id: scan
        if: ${{ !inputs.dry_run }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: "sbom-${{ inputs.image }}.json"
          only-fixed: true
          add-cpes-if-none: true
          fail-build: false

      - name: Upload scan result to GitHub Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: build-${{ inputs.image }}
