name: Build

on:
  workflow_call:
    inputs:
      platforms:
        required: true
        type: string
      build-os:
        required: false
        type: string
        default: ''
      image:
        required: true
        type: string
      tag:
        required: false
        type: string
        default: ''
      dry_run:
        required: false
        type: boolean
        default: false
      runner:
        required: false
        type: string
        default: 'ubuntu-24.04'
      oss_registry:
        description: |
          Registry and namespace for the OSS images (ngf, nginx, operator).
          Empty means ghcr.io/<repository owner>, which is where they are
          published from this repository.
        required: false
        type: string
        default: ''
      plus_registry:
        description: |
          Registry for the NGINX Plus images (plus, plus-nap-waf). Empty means
          docker-mgmt.nginx.com.
        required: false
        type: string
        default: ''
      source_ref:
        description: |
          Commit or branch to build from. Empty keeps the tag-driven
          behaviour the public release path relies on: check out
          refs/tags/<tag> and let metadata-action read git for the version.

          Release prep sets it, because prep builds from an internal branch
          before any tag exists -- the tag is created by publish, at the very
          end, and the mirror sync would otherwise carry a release tag to the
          public repository early. A tag appearing publicly ahead of release
          day is itself a disclosure signal on a CVE release.
        required: false
        type: string
        default: ''
      image_prefix:
        description: Repository path prefix under the registry.
        required: false
        type: string
        default: 'nginx-gateway-fabric'
      nginx_oss_pkg_host:
        description: |
          Host serving the NGINX OSS packages. Empty means the Dockerfile
          default, packages.nginx.org.
        required: false
        type: string
        default: ''
      nginx_plus_pkg_host:
        description: |
          Host serving the NGINX Plus packages. Empty means the Dockerfile
          default, pkgs.nginx.com.
        required: false
        type: string
        default: ''
      nginx_agent_pkg_host:
        description: |
          Host serving the NGINX Agent packages. Empty means the Dockerfile
          default, which differs by base image: pkgs.nginx.com for Alpine and
          packages.nginx.org for UBI.
        required: false
        type: string
        default: ''
      nap_waf_pkg_host:
        description: |
          Host serving the F5 WAF for NGINX packages. Empty means the
          Dockerfile default, pkgs.nginx.com.
        required: false
        type: string
        default: ''

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build:
    if: ${{ ! (github.event.pull_request.head.repo.fork && (inputs.image == 'plus' || inputs.image == 'plus-nap-waf') && inputs.build-os == 'ubi') }}
    permissions:
      contents: read # for docker/build-push-action to read repo content
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      packages: write # for docker/build-push-action to push to GHCR
      id-token: write # for docker/login to login to NGINX registry
    runs-on: ${{ inputs.runner }}
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || ((inputs.tag != '' && !inputs.dry_run && inputs.image != 'operator') && format('refs/tags/{0}', inputs.tag) || github.ref) }}

      - name: Get secrets
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@2ac905a974d15594f0e03697b4f88916fbb3694d
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.AZ_VAULT_NAME }}
          secret-names: "gcp-workload-identity,gcp-service-account,gcp-project-id"

      - name: Get secrets from common vault
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@2ac905a974d15594f0e03697b4f88916fbb3694d
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.AZ_COMMON_VAULT_NAME }}
          secret-names: "docker-username,docker-password${{ (inputs.image == 'plus' || inputs.image == 'plus-nap-waf') && ',nginx-pkg-certificate,nginx-pkg-key' || '' }}"
          env-names: "DOCKER_USERNAME,DOCKER_PASSWORD${{ (inputs.image == 'plus' || inputs.image == 'plus-nap-waf') && ',NGINX_CRT,NGINX_KEY' || '' }}"

      - name: Resolve the image target
        id: target
        env:
          IMAGE: ${{ inputs.image }}
          OWNER: ${{ github.repository_owner }}
          OSS_REGISTRY: ${{ inputs.oss_registry }}
          PLUS_REGISTRY: ${{ inputs.plus_registry }}
          IMAGE_PREFIX: ${{ inputs.image_prefix }}
        run: .github/scripts/resolve-image-target.sh | tee -a "$GITHUB_OUTPUT"

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ github.run_id }}
          path: ${{ github.workspace }}/dist

      - name: Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
        if: ${{ inputs.runner == 'ubuntu-24.04-amd64' }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ github.repository == 'nginx/nginx-gateway-fabric' && github.event_name != 'pull_request' && steps.target.outputs.host == 'ghcr.io' }}
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Not gated by repository: minting an OIDC token reaches no registry
      # and publishes nothing. The two login steps below are what decide
      # which registry it is spent on.
      - name: Get Id Token
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: idtoken
        with:
          script: |
            let id_token = await core.getIDToken()
            core.setOutput('id_token', id_token)
        if: ${{ github.event_name != 'pull_request' && endsWith(steps.target.outputs.host, 'nginx.com') }}

      # Two steps with the same body, differing only in the gate. The
      # gating grammar can express "public only" and "mirror only" and
      # deliberately cannot express "either", because allowing a top-level
      # `||` at all means reading every future one to decide whether it is
      # safe. Duplication is the price, and it is paid here rather than in a
      # condition nobody can check mechanically.
      #
      # The host differs even though the body does not: in the public
      # repository the target resolves to the production registry, and in the
      # mirror to the staging one prep was given.
      - name: Login to NGINX Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.target.outputs.host }}
          username: ${{ steps.idtoken.outputs.id_token }}
          password: ${{ github.actor }}
        if: ${{ github.repository == 'nginx/nginx-gateway-fabric' && github.event_name != 'pull_request' && endsWith(steps.target.outputs.host, 'nginx.com') }}

      - name: Login to the staging NGINX Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.target.outputs.host }}
          username: ${{ steps.idtoken.outputs.id_token }}
          password: ${{ github.actor }}
        if: ${{ github.repository == vars.INTERNAL_REPOSITORY && github.event_name != 'pull_request' && endsWith(steps.target.outputs.host, 'nginx.com') }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
        if: ${{ github.repository == 'nginx/nginx-gateway-fabric' && github.event_name != 'pull_request' && (inputs.image == 'plus' || inputs.image == 'plus-nap-waf') }}

      - name: Login to GAR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
        if: ${{ github.repository == 'nginx/nginx-gateway-fabric' && github.event_name != 'pull_request' && (inputs.image == 'plus' || inputs.image == 'plus-nap-waf') }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # `git` reads the checked-out tag for the version. Prep has no tag
          # to read, so a source_ref build uses `workflow`; the semver rule
          # below carries an explicit `value=`, so it does not need git.
          context: ${{ inputs.source_ref == '' && inputs.tag != '' && 'git' || 'workflow' }}
          # Every shared destination is gated on github.repository, not on
          # github.repository_owner: the private mirror reports the same owner
          # and would otherwise publish from any of these names. The gate is
          # what decides publication -- `push:` below pushes whatever the tag
          # list ended up holding, so a name disabled here never reaches a
          # registry.
          #
          # This changes nothing today, because ci.yml's calling job is already
          # gated to the public repository. It matters when release prep starts
          # calling this workflow from the mirror: prep adds its own staging
          # name gated on vars.INTERNAL_REPOSITORY rather than widening these.
          # The GAR names in particular are unparameterised and public-facing,
          # so gating them is what stops a prep run reaching GAR whether or not
          # GAR has been retired by then.
          images: |
            name=${{ steps.target.outputs.target }},enable=${{ github.repository == 'nginx/nginx-gateway-fabric' && github.event_name != 'pull_request' }}
            name=${{ steps.target.outputs.target }},enable=${{ github.repository == vars.INTERNAL_REPOSITORY && github.event_name != 'pull_request' }}
            name=us-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/nginx-gateway-fabric/nginx-plus,enable=${{ github.repository == 'nginx/nginx-gateway-fabric' && inputs.image == 'plus' && github.event_name != 'pull_request' }}
            name=us-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/nginx-gateway-fabric/nginx-plus-f5waf,enable=${{ github.repository == 'nginx/nginx-gateway-fabric' && inputs.image == 'plus-nap-waf' && github.event_name != 'pull_request' }}
            name=localhost:5000/nginx-gateway-fabric/${{ inputs.image }}
          flavor: |
            latest=${{ (inputs.source_ref != '' || inputs.build-os != '') && 'false' || (inputs.tag != '' && 'true') || 'auto' }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }},suffix=${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
            type=edge,suffix=${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
            type=schedule,suffix=${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
            type=ref,event=pr,suffix=${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
            type=ref,event=branch,suffix=-rc${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }},enable=${{ startsWith(github.ref, 'refs/heads/release') && inputs.tag == '' }}
          labels: |
            org.opencontainers.image.documentation=https://docs.nginx.com/nginx-gateway-fabric
            org.opencontainers.image.vendor=NGINX Inc <kubernetes@nginx.com>
          annotations: |
            org.opencontainers.image.documentation=https://docs.nginx.com/nginx-gateway-fabric
            org.opencontainers.image.vendor=NGINX Inc <kubernetes@nginx.com>
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/nginx/nginx-gateway-fabric/main/README.md
            io.artifacthub.package.logo-url=https://docs.nginx.com/nginx-gateway-fabric/images/icons/NGINX-product-icon.svg
            io.artifacthub.package.maintainers=[{"name":"NGINX Inc","email":"kubernetes@nginx.com"}]
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.keywords=kubernetes,gateway,nginx
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Build Docker Image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ${{ inputs.image == 'operator' && 'operators/Dockerfile' || (inputs.build-os != '' && format('build/{0}/Dockerfile{1}', inputs.build-os, inputs.image == 'nginx' && '.nginx' || (inputs.image == 'plus' || inputs.image == 'plus-nap-waf') && '.nginxplus' || '') || format('build/Dockerfile{0}', inputs.image == 'nginx' && '.nginx' || (inputs.image == 'plus' || inputs.image == 'plus-nap-waf') && '.nginxplus' || '')) }}
          context: "."
          target: ${{ inputs.image == 'ngf' && 'goreleaser' || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          push: ${{ !inputs.dry_run }}
          platforms: ${{ inputs.platforms }}
          cache-from: type=gha,scope=${{ inputs.image }}${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}
          cache-to: type=gha,scope=${{ inputs.image }}${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }},mode=max
          pull: true
          no-cache: ${{ github.event_name != 'pull_request' }}
          sbom: true
          # Not mode=max: that embeds the whole GitHub event payload, including
          # commit messages, in the attestation. Harmless from a public
          # repository, but release builds move to a private mirror, where it
          # would publish embargoed fix descriptions on every released image.
          provenance: mode=min
          build-args: |
            NJS_DIR=internal/controller/nginx/modules/src
            NGINX_CONF_DIR=internal/controller/nginx/conf
            BUILD_AGENT=gha
            INCLUDE_NAP_WAF=${{ inputs.image == 'plus-nap-waf' && 'true' || 'false' }}
            ${{ inputs.nginx_oss_pkg_host != '' && format('NGINX_OSS_PKG_HOST={0}', inputs.nginx_oss_pkg_host) || '' }}
            ${{ inputs.nginx_plus_pkg_host != '' && format('NGINX_PLUS_PKG_HOST={0}', inputs.nginx_plus_pkg_host) || '' }}
            ${{ inputs.nginx_agent_pkg_host != '' && format('NGINX_AGENT_PKG_HOST={0}', inputs.nginx_agent_pkg_host) || '' }}
            ${{ inputs.nap_waf_pkg_host != '' && format('NAP_WAF_PKG_HOST={0}', inputs.nap_waf_pkg_host) || '' }}
          secret-envs: |
            ${{ (inputs.image == 'plus' || inputs.image == 'plus-nap-waf') && 'nginx-repo.crt=NGINX_CRT' || '' }}
            ${{ (inputs.image == 'plus' || inputs.image == 'plus-nap-waf') && 'nginx-repo.key=NGINX_KEY' || '' }}

      # What release prep hands to release publish. Publish promotes by
      # digest and never resolves a tag in the staging registry, because a
      # re-run of prep -- or any other writer -- could move a tag between the
      # two stages. This is where that digest is captured.
      #
      # A file per job rather than a job output: a matrix leg cannot return
      # one. Every leg writes the same key and the last to finish wins, so
      # four of the six build legs would vanish. Artifacts do not collide.
      #
      # Written before the SBOM and scan steps so that a scan failure does not
      # lose the record of an image already pushed to the registry.
      - name: Record the pushed digest
        if: ${{ !inputs.dry_run && github.event_name != 'pull_request' }}
        env:
          IMAGE: ${{ inputs.image }}
          BUILD_OS: ${{ inputs.build-os }}
          TARGET: ${{ steps.target.outputs.target }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          [ -n "${DIGEST}" ] || { echo "error: the build produced no digest" >&2; exit 1; }
          mkdir -p digests
          name="${IMAGE}${BUILD_OS:+-${BUILD_OS}}"
          jq -n --arg image "${IMAGE}" --arg os "${BUILD_OS}" --arg target "${TARGET}" --arg digest "${DIGEST}" --arg platforms "${PLATFORMS}" '{image: $image, "base-os": $os, target: $target, digest: $digest, platforms: $platforms}' | tee "digests/${name}.json"

      - name: Upload the digest record
        if: ${{ !inputs.dry_run && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ inputs.image }}${{ inputs.build-os != '' && format('-{0}', inputs.build-os) || '' }}-${{ github.run_id }}
          path: digests/
          retention-days: 1
          if-no-files-found: error

      - name: Inspect SBOM and output manifest
        if: ${{ !inputs.dry_run }}
        run: |
          # For single-platform builds, SBOM is not indexed by platform
          # For multi-platform builds, we need to index by platform
          if [[ "${{ inputs.platforms }}" == *","* ]] || [[ "${{ inputs.platforms }}" == *" "* ]]; then
          # Multi-platform build - index by platform
          docker buildx imagetools inspect localhost:5000/nginx-gateway-fabric/${{ inputs.image }}:${{ steps.meta.outputs.version }} --format '{{ json (index .SBOM "linux/amd64").SPDX }}' > sbom-${{ inputs.image }}.json
          else
          # Single-platform build - SBOM is at top level
          docker buildx imagetools inspect localhost:5000/nginx-gateway-fabric/${{ inputs.image }}:${{ steps.meta.outputs.version }} --format '{{ json .SBOM.SPDX }}' > sbom-${{ inputs.image }}.json
          fi
          docker buildx imagetools inspect localhost:5000/nginx-gateway-fabric/${{ inputs.image }}:${{ steps.meta.outputs.version }} --raw

      - name: Scan SBOM
        id: scan
        if: ${{ !inputs.dry_run }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: "sbom-${{ inputs.image }}.json"
          only-fixed: true
          add-cpes-if-none: true
          fail-build: false

      - name: Upload scan result to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: build-${{ inputs.image }}
