name: NGINX Agent Branch Testing

on:
  workflow_dispatch:
    inputs:
      agent-branch:
        description: Name of the NGINX Agent branch to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  check-input:
    name: Validate NGINX Agent branch exists
    if: github.repository == 'nginx/nginx-gateway-fabric'
    runs-on: ubuntu-26.04
    steps:
      - name: Check branch exists in Agent
        env:
          AGENT_BRANCH: ${{ inputs.agent-branch }}
        run: |
          if ! git check-ref-format --branch "${AGENT_BRANCH}"; then
          echo "Invalid branch name: ${AGENT_BRANCH}"
          exit 1
          fi

          if ! git ls-remote --exit-code --heads https://github.com/nginx/agent.git "refs/heads/${AGENT_BRANCH}" >/dev/null 2>&1; then
          echo "NGINX Agent branch does not exist: ${AGENT_BRANCH}"
          exit 1
          fi

  vars:
    name: Set variables
    needs: check-input
    if: github.repository == 'nginx/nginx-gateway-fabric'
    runs-on: ubuntu-26.04
    outputs:
      min-k8s-version: ${{ steps.versions.outputs.min-k8s-version }}
      k8s-latest: ${{ steps.versions.outputs.k8s-latest }}
    steps:
      - id: versions
        run: |
          echo 'k8s-latest=v1.37.0' >> "$GITHUB_OUTPUT" # renovate: datasource=docker depName=kindest/node

  rust-modules:
    name: Build Rust Modules
    runs-on: ubuntu-26.04
    needs: [vars]
    if: github.repository == 'nginx/nginx-gateway-fabric'
    strategy:
      fail-fast: false
      matrix:
        # musl for Alpine images, glibc for UBI images.
        libc: [musl, glibc]
        arch: [amd64]
        nginx-flavor: [oss, plus]
    permissions:
      contents: read
      id-token: write # for get-from-vault to authenticate with Azure
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get secrets from common vault
        if: ${{ matrix.libc == 'glibc' || matrix.nginx-flavor == 'plus' }}
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@2ac905a974d15594f0e03697b4f88916fbb3694d
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.AZ_COMMON_VAULT_NAME }}
          secret-names: "nginx-pkg-certificate,nginx-pkg-key"
          env-names: "NGINX_CRT,NGINX_KEY"

      - name: Resolve NGINX version for this build
        id: nginx-version
        run: |
          if [ "${{ matrix.nginx-flavor }}" = "plus" ]; then
            ver=$(grep -oP '(?<=^ARG NGINX_PLUS_SOURCE_VERSION=).+' build/Dockerfile.rustmodules)
            echo "nginx_version=${ver}" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Setup QEMU
        if: ${{ matrix.arch == 'arm64' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Build Rust modules (${{ matrix.libc }}/${{ matrix.arch }}/${{ matrix.nginx-flavor }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: build/Dockerfile.rustmodules
          context: "."
          target: export
          push: false
          platforms: linux/${{ matrix.arch }}
          outputs: type=local,dest=${{ github.workspace }}/rust-modules
          build-args: |
            LIBC=${{ matrix.libc }}
            ${{ matrix.nginx-flavor == 'plus' && format('NGINX_VERSION={0}', steps.nginx-version.outputs.nginx_version) || '' }}
          secret-envs: |
            ${{ env.NGINX_CRT != '' && 'nginx-repo.crt=NGINX_CRT' || '' }}
            ${{ env.NGINX_KEY != '' && 'nginx-repo.key=NGINX_KEY' || '' }}
          cache-from: type=gha,scope=rust-modules-${{ matrix.libc }}-${{ matrix.arch }}-${{ matrix.nginx-flavor }}
          cache-to: type=gha,scope=rust-modules-${{ matrix.libc }}-${{ matrix.arch }}-${{ matrix.nginx-flavor }},mode=max
          no-cache: true

      - name: Upload Rust modules
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-modules-${{ matrix.libc == 'musl' && 'alpine' || 'ubi' }}-${{ matrix.arch }}-${{ matrix.nginx-flavor }}-${{ github.run_id }}
          path: ${{ github.workspace }}/rust-modules/
          retention-days: 7

  functional-tests:
    name: Functional tests
    needs: [vars, rust-modules]
    if: github.repository == 'nginx/nginx-gateway-fabric'
    strategy:
      fail-fast: false
      matrix:
        image: [nginx, plus, plus-waf]
        build-os: ['']
        k8s-version:
          - ${{ needs.vars.outputs.k8s-latest }}
    uses: ./.github/workflows/functional.yml
    with:
      image: ${{ matrix.image }}
      build-os: ${{ matrix.build-os }}
      k8s-version: ${{ matrix.k8s-version }}
      agent-branch: ${{ inputs.agent-branch }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  conformance-tests:
    name: Conformance tests
    needs: [vars, rust-modules]
    if: github.repository == 'nginx/nginx-gateway-fabric'
    strategy:
      fail-fast: false
      matrix:
        image: [nginx, plus]
        build-os: ['']
        k8s-version:
          - ${{ needs.vars.outputs.k8s-latest }}
        enable-experimental: [true]
    uses: ./.github/workflows/conformance.yml
    with:
      image: ${{ matrix.image }}
      build-os: ${{ matrix.build-os }}
      k8s-version: ${{ matrix.k8s-version }}
      enable-experimental: ${{ matrix.enable-experimental }}
      enable-inference-extension: true
      agent-branch: ${{ inputs.agent-branch }}
      keep-profile: ${{ matrix.image == 'nginx' && matrix.build-os == '' && matrix.k8s-version == needs.vars.outputs.k8s-latest && matrix.enable-experimental }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
