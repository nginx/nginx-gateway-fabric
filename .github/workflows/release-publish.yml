name: Release Publish

# Stage two of two. Promotes the artifacts release prep built and tested in
# the private mirror, and creates the release here. It builds nothing: the
# image a customer pulls is byte-for-byte the one prep's tests validated.
# verify-merge-back gates the run at the start: the public release branch must
# be the very commit prep built and signed. `tag` needs every publishing job,
# so no tag exists unless the images, chart and assets all published. The
# operator bundle and the GitHub release come after the tag; if either fails,
# dispatching publish again finishes the release on the same tag.

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: The release to publish, for example v2.8.0. Prep must have run for it.
        required: true
        type: string
      manifest_sha256:
        description: >
          The sha256 of the manifest to publish. Promote passes the one it
          checked; for a manual run, copy it from the promote or prep run
          summary. Only those exact bytes are published.
        required: true
        type: string
      mode:
        description: >
          verify checks the manifest, the release branch and the assets and
          publishes nothing. publish releases: images, chart, tag, GitHub
          release and operator bundle.
        required: true
        type: choice
        options:
          - verify
          - publish
        default: verify
      submit_operator_to_redhat:
        description: >
          Also open the operator bundle pull request against RedHat
          certified-operators. Untick only to re-run a publish whose RedHat
          pull request already exists.
        required: false
        type: boolean
        default: true

run-name: >-
  ${{ inputs.mode == 'verify' && '[VERIFY] ' || '' }}Publish ${{ inputs.release_version }}
  (${{ inputs.manifest_sha256 }}) by @${{ github.actor }}

# Serialises publish runs in this repository. The release branch comes from
# the manifest, which is not known until the first job, so the group is
# repository-wide; publishes are rare enough that this costs nothing. Prep
# runs in the mirror, so no group can span the two; promote orders them.
concurrency:
  group: release-publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

# Every job runs on the public repository's internal runner, as production
# release work always has; publish moves production artifacts even though it
# builds none.
jobs:
  verify-merge-back:
    name: Verify the merge-back
    runs-on: ubuntu-26.04-amd64
    if: github.repository == 'nginx/nginx-gateway-fabric'
    permissions:
      contents: read
      id-token: write # for get-from-vault to authenticate with Azure
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      release_branch: ${{ steps.branch.outputs.release_branch }}
      operator_version: ${{ steps.release.outputs.operator_version }}
    steps:
      # This workflow's own ref, not the release branch. The verifier must
      # not come from the branch it is verifying: a dispatch naming some other
      # branch would otherwise supply its own verify-release-manifest.sh and
      # pass unconditionally. fetch-depth 0 brings every branch, so the release
      # branch still resolves below as data.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The mirror's name, held in the vault so this public run's log masks it.
      # A separate entry from the mirror's INTERNAL_REPOSITORY variable, so
      # that one stays defined only in the mirror and "is this the mirror?"
      # has a single answer. The asset store holds the manifest prep signed.
      - name: Get the signer repository and the asset store from the vault
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@2ac905a974d15594f0e03697b4f88916fbb3694d
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.AZ_VAULT_NAME }}
          secret-names: "release-signer-repository,azure-storage-account,azure-storage-bucket"
          env-names: "SIGNER_REPOSITORY,AZURE_STORAGE_ACCOUNT,AZURE_STORAGE_CONTAINER"

      - name: Log in to Azure for the manifest
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          allow-no-subscriptions: true

      # Fetched as files, so the bytes are the ones prep signed. The store is
      # not trusted: the next step verifies the signature before anything in
      # the manifest is used.
      - name: Fetch the manifest and its signature bundle
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          STORAGE_ACCOUNT: ${{ env.AZURE_STORAGE_ACCOUNT }}
          STORAGE_CONTAINER: ${{ env.AZURE_STORAGE_CONTAINER }}
        run: .github/scripts/release-manifest-store.sh get

      # The release branch follows from the version: vX.Y.Z ships from
      # release-X.Y. A manifest built on any other branch is refused, so a
      # manual publish cannot tag another line's commit as this version.
      - name: Check the manifest's branch matches the version
        id: branch
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_VERSION}" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]] || { echo "error: release_version must look like vX.Y.Z, got '${RELEASE_VERSION}'" >&2; exit 1; }
          want="release-${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          internal="$(jq -r '.source.internal_branch // ""' release-manifest.json)"
          [ "${internal}" = "internal/${want}" ] || { echo "error: ${RELEASE_VERSION} ships from ${want}, but the manifest was built on '${internal}'" >&2; exit 1; }
          echo "release_branch=${want}" | tee -a "$GITHUB_OUTPUT"

      - name: Verify the signature, the schema and the tree
        id: verify
        env:
          MANIFEST: release-manifest.json
          SIGNATURE_BUNDLE: release-manifest.sigstore.json
          # Remote-tracking, since the branch itself is not checked out here.
          VERIFY_REF: origin/${{ steps.branch.outputs.release_branch }}
        run: .github/scripts/verify-release-manifest.sh | tee -a "$GITHUB_OUTPUT"

      - name: Assert the manifest is for the release being published
        id: release
        env:
          WANT: ${{ inputs.release_version }}
        # The store is keyed by version, so a disagreement means it holds the
        # wrong file, and promoting that would mistag the images. The operator
        # version is read here, after verification, so every later job takes
        # it from the signed manifest.
        run: |
          set -euo pipefail
          got="$(jq -r '.release_version' release-manifest.json)"
          [ "${got}" = "${WANT}" ] || { echo "error: the manifest stored for ${WANT} is for ${got}" >&2; exit 1; }
          echo "manifest is for ${got}"
          operator="$(jq -r '.operator_version // ""' release-manifest.json)"
          [[ "${operator}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "error: manifest operator_version '${operator}' is not a version" >&2; exit 1; }
          echo "operator_version=${operator}" >> "$GITHUB_OUTPUT"

      - name: Keep the manifest and bundle for the later jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest-${{ github.run_id }}
          path: |
            release-manifest.json
            release-manifest.sigstore.json
          if-no-files-found: error

  promote-images:
    name: Promote the images
    needs: [verify-merge-back]
    runs-on: ubuntu-26.04-amd64
    if: github.repository == 'nginx/nginx-gateway-fabric'
    permissions:
      contents: read
      packages: write # for pushing the promoted images to ghcr.io
      id-token: write # for docker/login to the NGINX registries
    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-merge-back.outputs.sha }}
          fetch-depth: 0 # tags, to decide whether this release becomes latest

      - name: Download the manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-manifest-${{ github.run_id }}

      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo

      - name: Get Id Token
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: idtoken
        with:
          script: |
            let id_token = await core.getIDToken()
            core.setOutput('id_token', id_token)

      # Read mirrors take the licence JWT as username; write endpoints take a
      # short-lived OIDC token instead. Promotion reads from the mirror.
      - name: Get the registry JWT from the vault
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@2ac905a974d15594f0e03697b4f88916fbb3694d
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.AZ_VAULT_NAME }}
          secret-names: "jwt-plus-waf-registry,staging-read-registry"
          env-names: "JWT_PLUS_WAF_REGISTRY,STAGING_READ_REGISTRY"

      - name: Login to the staging NGINX registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ github.repository == 'nginx/nginx-gateway-fabric' }}
        with:
          registry: ${{ env.STAGING_READ_REGISTRY }}
          username: ${{ env.JWT_PLUS_WAF_REGISTRY }}
          password: none

      - name: Login to the production NGINX registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ github.repository == 'nginx/nginx-gateway-fabric' }}
        with:
          registry: docker-mgmt.nginx.com
          username: ${{ steps.idtoken.outputs.id_token }}
          password: ${{ github.actor }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ github.repository == 'nginx/nginx-gateway-fabric' }}
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --source-digests copies each image by the digest prep recorded, so a
      # staging tag moved since then cannot change what ships. The operator is
      # versioned on its own, and its tag comes from the verified manifest.
      # `latest` goes on the default variants only, and only when this is the
      # highest release: a patch on an older line must not move it backwards.
      - name: Promote by digest
        env:
          # STAGING_READ_REGISTRY comes from the vault step above:
          # registries-production sources from it and targets the public
          # registries by name. Nothing here writes to staging.
          TARGET_TAG: ${{ inputs.release_version }}
          OPERATOR_VERSION: ${{ needs.verify-merge-back.outputs.operator_version }}
          # Read by copy-images.sh; `true` prints the plan and copies nothing.
          DRY_RUN: ${{ inputs.mode != 'publish' }}
        run: |
          set -euo pipefail
          args=(--config production --source-digests release-manifest.json)
          args+=(--target-tag "${TARGET_TAG#v}" --operator-target-tag "${OPERATOR_VERSION#v}")
          highest="$( { git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; echo "${TARGET_TAG}"; } | sort -V | tail -n1)"
          if [ "${highest}" = "${TARGET_TAG}" ]; then
          args+=(--additional-target-tag latest)
          else
          echo "${highest} is newer than ${TARGET_TAG}; latest stays where it is"
          fi
          .github/scripts/copy-images.sh "${args[@]}"

  publish-chart:
    name: Publish the Helm chart
    needs: [verify-merge-back, promote-images]
    if: github.repository == 'nginx/nginx-gateway-fabric'
    uses: ./.github/workflows/publish-helm.yml
    with:
      runner: ubuntu-26.04-amd64
      # Empty versions package the chart exactly as it is in the verified
      # tree, which is what a release ships.
      app_version: ''
      chart_version: ''
      ref: ${{ needs.verify-merge-back.outputs.sha }}
      dry_run: ${{ inputs.mode != 'publish' }}
    permissions:
      contents: read
      packages: write
    secrets: inherit

  redhat-certification:
    name: Submit images for RedHat certification
    needs: [verify-merge-back, promote-images]
    # Reads the promoted images from ghcr.io, so it cannot run before
    # promotion has happened.
    if: github.repository == 'nginx/nginx-gateway-fabric' && (inputs.mode == 'publish')
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ngf
            tag: ${{ inputs.release_version }}
          - image: nginx
            tag: ${{ inputs.release_version }}
          # The operator is promoted under its own version, not the NGF one.
          - image: operator
            tag: ${{ needs.verify-merge-back.outputs.operator_version }}
    uses: ./.github/workflows/redhat-certification.yml
    with:
      runner: ubuntu-26.04-amd64
      image: ${{ matrix.image }}
      tag: ${{ matrix.tag }}
      dry_run: ${{ inputs.mode != 'publish' }}
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  release-assets:
    name: Fetch and verify the release assets
    needs: [verify-merge-back]
    runs-on: ubuntu-26.04-amd64
    if: github.repository == 'nginx/nginx-gateway-fabric'
    permissions:
      contents: read
      id-token: write # for azure/login and get-from-vault
    outputs:
      count: ${{ steps.fetch.outputs.count }}
    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-merge-back.outputs.sha }}

      - name: Download the manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-manifest-${{ github.run_id }}

      - name: Get the storage account and container from the vault
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@2ac905a974d15594f0e03697b4f88916fbb3694d
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.AZ_VAULT_NAME }}
          secret-names: "azure-storage-account,azure-storage-bucket,release-signer-repository"
          env-names: "AZURE_STORAGE_ACCOUNT,AZURE_STORAGE_CONTAINER,SIGNER_REPOSITORY"

      # The same identity that reads the vault. No subscription: the blob
      # commands address the storage account by name and never go through ARM.
      - name: Log in to Azure for the download
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Publish never rebuilds these: a rebuild would produce different bytes
      # from the ones prep signed. Every file is verified against the manifest.
      - name: Fetch the assets and verify them against the manifest
        id: fetch
        env:
          MANIFEST: release-manifest.json
          OUT_DIR: assets
          STORAGE_ACCOUNT: ${{ env.AZURE_STORAGE_ACCOUNT }}
          STORAGE_CONTAINER: ${{ env.AZURE_STORAGE_CONTAINER }}
        run: .github/scripts/fetch-release-assets.sh | tee -a "$GITHUB_OUTPUT"

      - name: Upload for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ github.run_id }}
          path: assets/
          if-no-files-found: error

  # No tag unless every publishing job succeeded. `needs` is the whole gate:
  # a release is not a release if any of these did not land.
  tag:
    name: Tag the release
    needs: [verify-merge-back, promote-images, publish-chart, redhat-certification, release-assets]
    runs-on: ubuntu-26.04-amd64
    if: github.repository == 'nginx/nginx-gateway-fabric' && (inputs.mode == 'publish')
    permissions:
      contents: write # for pushing the tag
    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-merge-back.outputs.sha }}

      # The verified SHA, never the branch head, which may have moved since
      # verify-merge-back proved it is the commit prep built.
      - name: Create and push the tag
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          VERIFIED_SHA: ${{ needs.verify-merge-back.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A re-dispatch after a later job failed finds its own tag already
          # here. That is the same release, so carry on; a tag on any other
          # commit is a different release and is never moved.
          git fetch --no-tags origin "+refs/tags/${RELEASE_VERSION}:refs/tags/${RELEASE_VERSION}" 2>/dev/null || true
          if existing="$(git rev-parse -q --verify "refs/tags/${RELEASE_VERSION}^{commit}")"; then
          if [ "${existing}" = "${VERIFIED_SHA}" ]; then
          echo "tag ${RELEASE_VERSION} already points at ${VERIFIED_SHA}; nothing to do"
          exit 0
          fi
          echo "error: tag ${RELEASE_VERSION} already exists on ${existing}, not ${VERIFIED_SHA}" >&2
          exit 1
          fi
          git tag -a "${RELEASE_VERSION}" "${VERIFIED_SHA}" -m "Release ${RELEASE_VERSION}"
          git push origin "refs/tags/${RELEASE_VERSION}"
          echo "tagged ${VERIFIED_SHA} as ${RELEASE_VERSION}"

  operator-bundle:
    name: Generate the operator bundle
    needs: [verify-merge-back, tag]
    runs-on: ubuntu-26.04-amd64
    if: github.repository == 'nginx/nginx-gateway-fabric'
    permissions:
      actions: write # for dispatching operator-bundle-pr.yml
      contents: read # for checking the release branch head
    steps:
      # Dispatched on the release branch, which already has a federated
      # credential for the vault; a tag ref does not. The branch must still
      # be the verified commit, so the bundle is generated from what shipped.
      # The bundle generator wants the version without the `v` prefix.
      - name: Dispatch the operator bundle workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ needs.verify-merge-back.outputs.release_branch }}
          VERIFIED_SHA: ${{ needs.verify-merge-back.outputs.sha }}
          OPERATOR_VERSION: ${{ needs.verify-merge-back.outputs.operator_version }}
          SUBMIT: ${{ inputs.submit_operator_to_redhat }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_BRANCH}" --jq .sha)"
          if [ "${head}" != "${VERIFIED_SHA}" ]; then
          echo "error: ${RELEASE_BRANCH} is at ${head}, not the released ${VERIFIED_SHA}; dispatch operator-bundle-pr.yml by hand from the release commit" >&2
          exit 1
          fi
          echo "Dispatching the operator bundle for ${OPERATOR_VERSION#v} on ${RELEASE_BRANCH}"
          gh workflow run operator-bundle-pr.yml --repo "${GITHUB_REPOSITORY}" --ref "${RELEASE_BRANCH}" -f operator-version="${OPERATOR_VERSION#v}" -f submit-to-redhat="${SUBMIT}"

  github-release:
    name: Create the GitHub release
    needs: [verify-merge-back, release-assets, tag]
    runs-on: ubuntu-26.04-amd64
    if: github.repository == 'nginx/nginx-gateway-fabric'
    permissions:
      contents: write # for creating the release
      issues: write # for closing the milestone, which is part of the issues API
    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-merge-back.outputs.sha }}
          fetch-depth: 0 # tags, to resolve the previous release on this branch

      - name: Download the manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-manifest-${{ github.run_id }}

      - name: Download the assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets-${{ github.run_id }}
          path: assets

      # --generate-notes builds the changelog from merged pull requests, grouped
      # by the categories in .github/release.yml. --notes-start-tag pins the
      # comparison to the previous release: without it GitHub picks the latest
      # release repository-wide, which for a patch on an older line is a newer
      # release and produces nonsense. The previous release is found by version
      # order, not ancestry: patch tags live on release branches and are never
      # ancestors of main, so `git describe` from a minor release finds a tag
      # from the very start of the project.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          # The verified commit, not GITHUB_SHA, which on a dispatch is the
          # head of the starting ref and may have moved past this commit.
          VERIFIED_SHA: ${{ needs.verify-merge-back.outputs.sha }}
        run: |
          set -euo pipefail
          args=(--title "${RELEASE_VERSION}" --generate-notes --target "${VERIFIED_SHA}")
          # Prepended to the generated notes by the API. The generated list is
          # every pull request; CHANGELOG.md is the curated one worth reading.
          changelog="https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_VERSION}/CHANGELOG.md"
          args+=(--notes "*Below is the auto-generated changelog, which includes all PRs that went into the release. For a shorter version that highlights only important changes, see [CHANGELOG.md](${changelog}).*")
          previous="$(.github/scripts/previous-release-tag.sh "${RELEASE_VERSION}")"
          if [ -n "${previous}" ]; then
          echo "Generating notes since ${previous}"
          args+=(--notes-start-tag "${previous}")
          else
          echo "::warning title=No previous tag::Notes will cover the whole history."
          fi
          # A re-dispatch after a failure below finds the release already
          # created; the uploads that follow are --clobber, so they finish it.
          if gh release view "${RELEASE_VERSION}" >/dev/null 2>&1; then
          echo "release ${RELEASE_VERSION} already exists; completing its assets"
          else
          gh release create "${RELEASE_VERSION}" "${args[@]}"
          fi
          # The manifest is the public record mapping the SLSA provenance
          # (which names the mirror and an unresolvable commit) to this tag.
          gh release upload "${RELEASE_VERSION}" release-manifest.json release-manifest.sigstore.json --clobber
          find assets -type f -print0 | xargs -0 -r gh release upload "${RELEASE_VERSION}" --clobber

      - name: Close the milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          number="$(gh api "repos/${GITHUB_REPOSITORY}/milestones?state=open" --paginate |
          jq -r --arg title "${RELEASE_VERSION}" '.[] | select(.title == $title) | .number')"
          if [ -z "${number}" ]; then
          echo "No open milestone titled ${RELEASE_VERSION}; nothing to close."
          exit 0
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/milestones/${number}" -f state=closed >/dev/null
          echo "Closed milestone ${RELEASE_VERSION} (#${number})."

  # What was published and, on failure, how to finish. Whether the tag exists
  # decides that: before it, nothing is released and a re-run starts over;
  # after it, a re-run carries on from the existing tag and release.
  summary:
    name: Summarise the run
    needs: [verify-merge-back, promote-images, publish-chart, redhat-certification, release-assets, tag, operator-bundle, github-release]
    if: github.repository == 'nginx/nginx-gateway-fabric' && (always())
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Write the summary
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          MODE: ${{ inputs.mode }}
          VERIFIED_SHA: ${{ needs.verify-merge-back.outputs.sha }}
          RELEASE_BRANCH: ${{ needs.verify-merge-back.outputs.release_branch }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          {
          echo "## ${MODE^} ${RELEASE_VERSION}"
          echo
          echo "| Job | Result |"
          echo "| --- | --- |"
          jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"${RESULTS}"
          echo
          failed="$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")' <<<"${RESULTS}")"
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" --jq .object.sha 2>/dev/null || true)"
          if [ "${MODE}" = "verify" ]; then
          if [ -z "${failed}" ]; then
          echo "**Verified.** The manifest, branch \`${RELEASE_BRANCH}\` at \`${VERIFIED_SHA}\`, and the assets all check out. Nothing was published."
          else
          echo "**Verification failed** in: ${failed}. Nothing was published."
          fi
          elif [ -z "${failed}" ]; then
          echo "**Released.** \`${RELEASE_VERSION}\` is tagged on \`${VERIFIED_SHA}\`: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_VERSION}"
          echo
          echo "**Next:** review the operator bundle pull request and the RedHat certified-operators pull request, then follow After publishing in the release process."
          elif [ -z "${tag_sha}" ]; then
          public="$(jq -r '[("promote-images", "publish-chart") as $j | select(.[$j].result == "success") | $j] | join(" and ")' <<<"${RESULTS}")"
          echo "**Failed before the tag** in: ${failed}. No tag and no GitHub release exist.${public:+ But ${public} succeeded, so the images or chart are already public.} A re-run copies the same digests again."
          echo
          echo "**Next:** fix the cause, then **Re-run failed jobs** on this run."
          else
          echo "**Failed after the tag** in: ${failed}. \`${RELEASE_VERSION}\` is tagged and its images and chart are public."
          echo
          echo "**Next:** fix the cause, then **Re-run failed jobs** on this run. The existing tag and release are carried on from, not refused."
          fi
          } >> "$GITHUB_STEP_SUMMARY"
