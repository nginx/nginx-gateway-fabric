name: Release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true
        default: "0.0.0"
      operator-version:
        description: "Operator version to release"
        required: true
        default: "0.0.0"
      base-branch:
        description: |
          Branch to prepare the release on. Empty derives
          internal/release-X.Y from the version. That is where a release is
          prepared: public release-X.Y takes no commits before release day,
          and promote fast-forwards it from the internal branch.
        required: false
        default: ""

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-26.04
    if: github.repository == vars.INTERNAL_REPOSITORY
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Branch
        id: branch
        env:
          # Via env: workflow_dispatch inputs must not be pasted into a shell.
          VERSION: ${{ inputs.version }}
          BASE_BRANCH: ${{ inputs.base-branch }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_BRANCH}" ]; then
          echo "branch=${BASE_BRANCH}" >> "$GITHUB_OUTPUT"
          else
          echo "branch=internal/release-${VERSION%.*}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.branch.outputs.branch }}
          fetch-depth: 0

      # The changelog entries come from the commits on the branch, looked up
      # as pull requests in the public repository. GitHub's generated notes
      # cannot do this from here: they compare releases and pull requests of
      # the repository the workflow runs in, and the mirror has neither. The
      # public tags are fetched directly, since the sync carries branches.
      - name: Get Release Notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --quiet --force https://github.com/nginx/nginx-gateway-fabric.git 'refs/tags/v*:refs/tags/v*'
          previous="$(.github/scripts/previous-release-tag.sh "v${VERSION#v}")"
          [ -n "${previous}" ] || { echo "error: no release before v${VERSION#v}" >&2; exit 1; }
          echo "Changelog entries since ${previous}"
          .github/scripts/changelog-entries.sh --since "${previous}" --ref HEAD > release-notes.txt
          cat release-notes.txt

      - name: Vars
        id: vars
        run: |
          # TODO(lucacome): improve this and maybe use appVersion instead of version if we switch to tags
          echo "current_version=$(yq '.version' <charts/nginx-gateway-fabric/Chart.yaml)" >> $GITHUB_OUTPUT

      - name: Find and Replace
        uses: jacobtomlinson/gha-find-replace@f1069b438f125e5395d84d1c6fd3b559a7880cb5 # 3.0.5
        with:
          find: "edge"
          replace: ${{ inputs.version }}
          include: "charts/nginx-gateway-fabric/*.yaml"
          regex: false

      - name: Find and Replace
        uses: jacobtomlinson/gha-find-replace@f1069b438f125e5395d84d1c6fd3b559a7880cb5 # 3.0.5
        with:
          find: "edge"
          replace: ${{ inputs.operator-version }}
          include: "operators/Dockerfile"
          regex: false

      - name: Find and Replace
        uses: jacobtomlinson/gha-find-replace@f1069b438f125e5395d84d1c6fd3b559a7880cb5 # 3.0.5
        with:
          find: "VERSION ?= edge"
          replace: "VERSION ?= ${{ inputs.operator-version }}"
          include: "operators/Makefile"
          regex: false

      - name: Find and Replace
        uses: jacobtomlinson/gha-find-replace@f1069b438f125e5395d84d1c6fd3b559a7880cb5 # 3.0.5
        with:
          find: ${{ steps.vars.outputs.current_version }}
          replace: ${{ inputs.version }}
          include: "charts/nginx-gateway-fabric/*.yaml"
          regex: false

      - name: Find and Replace
        uses: jacobtomlinson/gha-find-replace@f1069b438f125e5395d84d1c6fd3b559a7880cb5 # 3.0.5
        with:
          find: "(?m)^VERSION = \\S+$"
          replace: "VERSION = ${{ inputs.version }}"
          include: "Makefile"
          regex: true

      - name: Find and Replace
        uses: jacobtomlinson/gha-find-replace@f1069b438f125e5395d84d1c6fd3b559a7880cb5 # 3.0.5
        with:
          find: ": Always"
          replace: ": IfNotPresent"
          include: "charts/nginx-gateway-fabric/*.yaml"
          regex: false

      # Inputs via env, not pasted into the script. The entries are inserted
      # from a file with `r`, so nothing in a pull request title is ever
      # parsed as sed.
      - name: Generate files and changelog
        env:
          VERSION: ${{ inputs.version }}
          OPERATOR_VERSION: ${{ inputs.operator-version }}
          CURRENT_VERSION: ${{ steps.vars.outputs.current_version }}
        run: |
          set -euo pipefail
          sed -i -e "s/v${CURRENT_VERSION}/v${VERSION}/g" README.md
          sed -i -e "s/\[${CURRENT_VERSION}\]/\[${VERSION}\]/g" README.md
          sed -i "6r .github/CHANGELOG_TEMPLATE.md" CHANGELOG.md
          sed -i -e "s/%%VERSION%%/${VERSION}/g" CHANGELOG.md
          sed -i -e "s/%%OPERATOR_VERSION%%/${OPERATOR_VERSION}/g" CHANGELOG.md
          printf '\n' >> release-notes.txt
          sed -i "8r release-notes.txt" CHANGELOG.md
          rm release-notes.txt
          make generate-all

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Release ${{ inputs.version }}
          title: Release ${{ inputs.version }}
          draft: true
          delete-branch: true
          branch: docs/release-${{ inputs.version }}
          # Explicit: the default is whatever branch is checked out, and the
          # version bump has to land on the one the release is built from.
          base: ${{ steps.branch.outputs.branch }}
          author: nginx-bot <integrations@nginx.com>
          committer: nginx-bot <integrations@nginx.com>
          body: |
            This automated PR updates all the necessary files for ${{ inputs.version }} release.
