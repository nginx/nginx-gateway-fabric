name: Internal Pull Request Tests

# Mirror only. Builds the images inside each test job from the pull request,
# with NGINX packages from the staging package host, and tests them in kind.
# Nothing is pushed: the staging registry only ever holds what release prep
# built. Public pull requests are tested by ci.yml instead.

on:
  pull_request:
    branches:
      - "internal/release-*"

concurrency:
  group: ${{ github.ref_name }}-internal-pr
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  vars:
    name: Variables
    runs-on: ubuntu-26.04
    if: github.repository == vars.INTERNAL_REPOSITORY
    outputs:
      k8s_latest: ${{ steps.vars.outputs.k8s_latest }}
    steps:
      - name: Output Variables
        id: vars
        run: |
          K8S_KIND_VERSION=v1.37.0 # renovate: datasource=docker depName=kindest/node
          echo "k8s_latest=${K8S_KIND_VERSION}" >> $GITHUB_OUTPUT

  rust-modules:
    name: Build Rust Modules
    runs-on: ${{ vars.INTERNAL_RUNNER }}
    needs: [vars]
    if: github.repository == vars.INTERNAL_REPOSITORY
    strategy:
      fail-fast: false
      matrix:
        libc: [musl, glibc]
        arch: [amd64, arm64]
        nginx-flavor: [oss, plus]
    permissions:
      contents: read
      id-token: write # for get-from-vault to authenticate with Azure
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get secrets from common vault
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@2ac905a974d15594f0e03697b4f88916fbb3694d
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.AZ_COMMON_VAULT_NAME }}
          secret-names: "nginx-pkg-certificate,nginx-pkg-key"
          env-names: "NGINX_CRT,NGINX_KEY"

      - name: Get the staging host
        uses: nginx/ci-self-hosted/.github/actions/get-from-vault@2ac905a974d15594f0e03697b4f88916fbb3694d
        with:
          client-id: ${{ secrets.AZ_VAULT_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_VAULT_TENANT_ID }}
          vault-name: ${{ secrets.AZ_VAULT_NAME }}
          secret-names: "staging-pkg-host"
          env-names: "STAGING_PKG_HOST"

      - name: Prepare staging source host
        run: |
          set -euo pipefail
          {
          echo 'NGINX_PKG_HOSTS<<EOF_PKG_HOSTS'
          echo "NGINX_SOURCE_HOST=${STAGING_PKG_HOST}"
          echo 'EOF_PKG_HOSTS'
          } >> "$GITHUB_ENV"

      - name: Resolve NGINX version for this build
        id: nginx-version
        run: |
          if [ "${{ matrix.nginx-flavor }}" = "plus" ]; then
            ver=$(grep -oP '(?<=^ARG NGINX_PLUS_SOURCE_VERSION=).+' build/Dockerfile.rustmodules)
            echo "nginx_version=${ver}" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Setup QEMU
        if: ${{ matrix.arch == 'arm64' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Build Rust modules (${{ matrix.libc }}/${{ matrix.arch }}/${{ matrix.nginx-flavor }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: build/Dockerfile.rustmodules
          context: "."
          target: export
          push: false
          platforms: linux/${{ matrix.arch }}
          outputs: type=local,dest=${{ github.workspace }}/rust-modules
          build-args: |
            LIBC=${{ matrix.libc }}
            ${{ matrix.nginx-flavor == 'plus' && format('NGINX_VERSION={0}', steps.nginx-version.outputs.nginx_version) || '' }}
          secret-envs: |
            nginx-repo.crt=NGINX_CRT
            nginx-repo.key=NGINX_KEY
            nginx-pkg-hosts=NGINX_PKG_HOSTS
          cache-from: type=gha,scope=rust-modules-${{ matrix.libc }}-${{ matrix.arch }}-${{ matrix.nginx-flavor }}
          cache-to: type=gha,scope=rust-modules-${{ matrix.libc }}-${{ matrix.arch }}-${{ matrix.nginx-flavor }},mode=max

      - name: Upload Rust modules
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-modules-${{ matrix.libc == 'musl' && 'alpine' || 'ubi' }}-${{ matrix.arch }}-${{ matrix.nginx-flavor }}-${{ github.run_id }}
          path: ${{ github.workspace }}/rust-modules/
          retention-days: 7

  functional-tests:
    name: Functional tests
    needs: [vars, rust-modules]
    if: github.repository == vars.INTERNAL_REPOSITORY
    strategy:
      fail-fast: false
      matrix:
        image: [nginx, plus, plus-waf]
    uses: ./.github/workflows/functional.yml
    with:
      runner: ${{ vars.INTERNAL_RUNNER }}
      image: ${{ matrix.image }}
      k8s-version: ${{ needs.vars.outputs.k8s_latest }}
      staging: true
    secrets: inherit
    permissions:
      contents: read
      id-token: write # for get-from-vault to authenticate with Azure

  conformance-tests:
    name: Conformance tests
    needs: [vars, rust-modules]
    if: github.repository == vars.INTERNAL_REPOSITORY
    strategy:
      fail-fast: false
      matrix:
        image: [nginx, plus]
    uses: ./.github/workflows/conformance.yml
    with:
      runner: ${{ vars.INTERNAL_RUNNER }}
      image: ${{ matrix.image }}
      k8s-version: ${{ needs.vars.outputs.k8s_latest }}
      enable-experimental: true
      enable-inference-extension: true
      keep-profile: false
      staging: true
    secrets: inherit
    permissions:
      contents: read
      id-token: write # for get-from-vault to authenticate with Azure

  # One check to require in the branch rules, rather than one per matrix leg.
  test-completion:
    name: Internal Pull Request Tests Pass
    if: github.repository == vars.INTERNAL_REPOSITORY && (always())
    needs: [functional-tests, conformance-tests]
    runs-on: ubuntu-26.04
    steps:
      - name: Check test results
        env:
          FUNCTIONAL: ${{ needs.functional-tests.result }}
          CONFORMANCE: ${{ needs.conformance-tests.result }}
        run: |
          [ "${FUNCTIONAL}" = "success" ] || { echo "::error::Functional tests ${FUNCTIONAL}"; exit 1; }
          [ "${CONFORMANCE}" = "success" ] || { echo "::error::Conformance tests ${CONFORMANCE}"; exit 1; }
          echo "All tests passed"
