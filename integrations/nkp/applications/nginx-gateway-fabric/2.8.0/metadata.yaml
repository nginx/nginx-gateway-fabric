overview: |-
  ## Overview

  NGINX Gateway Fabric is an open-source implementation of the [Kubernetes Gateway API](https://gateway-api.sigs.k8s.io/) using NGINX as the data plane. It provides a Kubernetes-native way to manage ingress traffic with advanced routing, TLS termination, and traffic management capabilities through the standardized Gateway API.

  ## Key Features

  - **Gateway API Native:** Implementation of the Kubernetes Gateway API standard. With the Gateway API CRDs that NKP installs, GatewayClass, Gateway, HTTPRoute, GRPCRoute, and ReferenceGrant are available. Other resources, such as TLSRoute, TCPRoute, UDPRoute, and BackendTLSPolicy, depend on the installed Gateway API version (see [Gateway API CRDs](#gateway-api-crds)).
  - **NGINX Data Plane:** Leverages the high-performance NGINX engine for traffic routing with low latency and high throughput.
  - **Two-Component Architecture:** Separate control plane (manages Gateway API resources) and data plane (handles actual traffic) for flexibility and scalability.
  - **Multiple Gateway Support:** Deploy multiple Gateways per instance, each with independent listener configurations.
  - **Observability:** Built-in Prometheus metrics for both control plane and data plane components.
  - **mTLS Control Plane Communication:** Secure communication between control plane and data plane via mutual TLS.

  ### Enterprise support and capabilities with F5 NGINX Plus

  If using NGINX Gateway Fabric with your F5 NGINX Plus image and license, you will get access to:

  - Enterprise level support and hardened releases
  - Advanced JWT and OIDC authentication
  - Zero downtime reconfiguration
  - Enhanced monitoring metrics
  - WAF Integration via NGINX App Protect

  ## GatewayClass Name

  Each instance creates its own GatewayClass, named after the instance (for example, `nginx-gateway-fabric-1`). Use this name in your Gateways instead of `nginx`:

  ```yaml
  apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata:
    name: gateway
  spec:
    gatewayClassName: nginx-gateway-fabric-1
    listeners:
    - name: http
      port: 80
      protocol: HTTP
  ```

  To see the GatewayClass for your instance, run `kubectl get gatewayclass`.

  ## Multiple Instances

  You can run multiple instances on the same cluster without extra configuration. Resource names, TLS Secrets, the GatewayClass and the controller name are all derived from the instance name, so instances don't conflict. Instance names must be 48 characters or fewer.

  ## Gateway API CRDs

  This application doesn't install the Gateway API CRDs. It uses the Gateway API version that your NKP release supports and installs (the `gateway-api-crds` release), so the available Gateway API resources depend on your NKP version.

  At startup, NGINX Gateway Fabric checks which Gateway API CRDs exist and turns off support for any that are missing. Resources it can't use are logged as `CRD not found, controller disabled`. If the CRDs on the cluster change, restart the NGINX Gateway Fabric Deployment so it detects them again.

  If the NKP-supported Gateway API version differs from the version NGINX Gateway Fabric recommends, the GatewayClass is still accepted but reports this condition:

  ```
  SupportedVersion=False (UnsupportedVersion): The Gateway API CRD versions are not recommended.
  ```

  This is a warning. Resources available in the installed version work normally.

  Don't replace the Gateway API CRDs that NKP manages. Recent Gateway API releases also install a `safe-upgrades.gateway.networking.k8s.io` ValidatingAdmissionPolicy, which can block NKP from reinstalling or upgrading its own Gateway API CRDs. Contact Nutanix support if you need a newer Gateway API version or experimental-channel features.

  ## Product Telemetry

  NGINX Gateway Fabric collects anonymous product telemetry by default. To turn it off, set this in the application's configuration override:

  ```yaml
  nginxGateway:
    productTelemetry:
      enable: false
  ```

  ## Deploying F5 NGINX Plus & Providing Secrets

  ### Environments which have internet access

  To deploy F5 NGINX Plus, create the following Secrets in your workspace namespace (for example, `kommander-default-workspace`), then set the values below in the application's configuration override:

  1. Create the NGINX Plus license secret:
      ```shell
      kubectl create secret generic nplus-license \
        --from-literal=license.jwt=<YOUR-JWT-TOKEN> \
        -n <workspace-namespace>
      ```

  2. Create the registry pull secret:
      ```shell
      kubectl create secret docker-registry nginx-plus-registry \
        --docker-server=private-registry.nginx.com \
        --docker-username=<JWT-TOKEN> \
        --docker-password=none \
        -n <workspace-namespace>
      ```

  3. In the application's configuration override, set:
      ```yaml
      nginx:
        plus: true
        image:
          repository: private-registry.nginx.com/nginx-gateway-fabric/nginx-plus
          tag: "2.8.0"
        imagePullSecret: nginx-plus-registry
        usage:
          secretName: nplus-license
      nginxGateway:
        image:
          repository: ghcr.io/nginx/nginx-gateway-fabric
          tag: "2.8.0"
      ```

  ## Air-Gapped Environments: Quick-Start Script for Security & Infrastructure Teams

  If you are deploying NGINX Gateway Fabric in an air-gapped environment, follow the steps below to ensure all necessary images are available locally.

  You will need to use the `nkp` CLI.

  ### 1. Clone the partner catalog repository

  On a workstation with internet access, clone the partner catalog repository first.

  ```shell
  git clone git@github.com:nutanix-cloud-native/nkp-partner-catalog.git
  cd nkp-partner-catalog
  ```

  ### 2. Create the air-gapped bundle

  ```shell
  nkp create catalog-bundle --apps=nginx-gateway-fabric=2.8.0 --airgapped
  ```

  ### 3. Move the bundle to your air-gapped environment

  ```shell
  # Push the bundle to the air-gapped registry
  nkp push bundle --bundle /path/to/file/nginx-gateway-fabric-2.8.0-airgapped.tar --to-registry <your-registry-url>

  # Create the catalog application
  nkp create catalog-application --url oci://<registry-url>/nkp-partner-catalog/nginx-gateway-fabric --tag 2.8.0 --workspace <your-workspace>
  ```

  NKP doesn't add registry credentials to catalog sources outside the management workspace. If your registry requires authentication or uses plain HTTP, configure the OCIRepository after creating it:

  ```shell
  nkp edit ocirepository -n <workspace-namespace> nkp-partner-catalog-nginx-gateway-fabric
  ```

  ## Uninstalling

  Before uninstalling an instance, delete the Gateways that use its GatewayClass. NGINX Gateway Fabric creates an NGINX Deployment and Service for each Gateway, and uninstalling the instance doesn't remove them: they keep running with their last configuration and keep their LoadBalancer IP addresses.

  Uninstalling the application also leaves these resources in place:

  - **TLS Secrets** created by the cert-generator Job, named `<instance-name>-server-tls` and `<instance-name>-agent-tls`. Delete them if you don't plan to reinstall with the same instance name.
  - **NGINX Gateway Fabric CRDs.** Helm doesn't delete CRDs. Deleting them also deletes any NGINX Gateway Fabric policy resources in the cluster.

