apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-app-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-app-1
  template:
    metadata:
      labels:
        app: secure-app-1
    spec:
      containers:
        - name: secure-app-1
          image: nginxdemos/nginx-hello:plain-text
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: secure-app-1
spec:
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: secure-app-1
---
